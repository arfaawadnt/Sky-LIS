/div><div class="field"><label>${tr('confirmPassword')} *</label><input class="k-input" type="password" value="Sky@2026"></div></div><div class="pass-rules"><div class="rule ok">✓ ${lang==='ar'?'8 أحرف على الأقل':'At least 8 characters'}</div><div class="rule ok">✓ ${lang==='ar'?'حرف كبير':'Uppercase letter'}</div><div class="rule ok">✓ ${lang==='ar'?'حرف صغير':'Lowercase letter'}</div><div class="rule ok">✓ ${lang==='ar'?'رقم':'Number'}</div><div class="rule ok">✓ ${lang==='ar'?'رمز خاص':'Special character'}</div><div class="rule ok">✓ ${lang==='ar'?'كلمتا المرور متطابقتان':'Passwords match'}</div></div></div>`;if(step===4)body=`<div style="text-align:center;padding:35px"><div style="width:70px;height:70px;border-radius:50%;background:#eaf7f1;color:#16855b;display:grid;place-items:center;font-size:32px;margin:0 auto 18px">✓</div><h2>${tr('subscriptionReady')}</h2><p class="muted">${lang==='ar'?'تم إنشاء رابط بوابة المختبر وإرساله إلى رقم محمول المدير.':'Your custom lab portal URL has been created and sent to the manager mobile number.'}</p><div class="info" style="margin:22px auto;max-width:440px;direction:ltr">https://alnoor.skylis.demo</div><button class="btn btn-primary" onclick="renderAuth('login')">${tr('login')}</button></div>`;

function badge(v){let low=String(v).toLowerCase(),cls=low==='active'||low==='paid'||low==='completed'||low==='approved'?'active':low==='inactive'?'inactive':low==='verified'||low==='reviewed'?'verified':'pending';let text=v;if(v==='Active')text=tr('active');else if(v==='Inactive')text=tr('inactive');else if(v==='Pending')text=tr('pending');else if(v==='Completed')text=dual('Completed','مكتمل');else if(v==='Open')text=dual('Open','مفتوح');else if(v==='Paid')text=dual('Paid','مدفوع');else if(v==='Approved')text=dual('Approved','مقبول');else if(v==='Reviewed')text=tr('review');else if(v==='Saved')text=tr('save');return `<span class="status ${cls}">${text}</span>`}
function actionButtons(r,mode){if(mode==='treasuryRequests')return r.status==='Pending'?`<button class="btn btn-sm btn-primary" onclick="approveReq(${r.id})">${tr('approve')}</button><button class="btn btn-sm btn-danger" onclick="rejectReq(${r.id})">${tr('reject')}</button>`:'<button class="row-btn">⋯</button>';if(mode==='payments')return `<button class="row-btn" title="${tr('makePayment')}" onclick="paymentDialog(${r.id})">＄</button><button class="row-btn" title="${tr('refund')}" onclick="refundDialog(${r.id})">↩</button>`;if(mode==='query')return `<button class="btn btn-sm btn-secondary" onclick="toast(tr('continueReg'));navigate('registration')">${tr('continueReg')}</button>`;if(mode==='worklist')return `<label class="remember"><input type="checkbox"> ${tr('exclude')}</label>`;if(current==='searchRegistration')return `<button class="row-btn" onclick="navigate('registration')">✎</button><button class="row-btn" onclick="sampleDialog(${r.id})">▥</button><button class="row-btn danger" onclick="cancelServiceDialog(${r.id})">⌫</button>`;if(current==='patients')return `<button class="row-btn" onclick="patientHistory(${r.id})">☷</button><button class="row-btn">✎</button>`;if(setupConfigs[mode])return `<button class="row-btn" onclick="openEditor('${mode}',${r.id})">✎</button><button class="row-btn danger" onclick="deleteSetup('${mode}',${r.id})">⌫</button>`;return '<button class="row-btn">⋯</button>'}
function openEditor(key,id=null){let c=setupConfigs[key],row=id?data[c.data].find(x=>x.id===id):{};editing={key,id};let fields=(c.fields||[]).map(f=>fieldControl(f,row)).join('');document.getElementById('modal').innerHTML=`<div class="modal ${key==='tests'||key==='services'||key==='pricelists'?'wide':''}"><div class="modal-head"><h3>${id?tr('edit'):tr('add')} ${tr(c.title)}</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">${fields}</div></div><div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-primary" onclick="saveEditor()">${tr('save')}</button></div></div>`;document.getElementById('modal').classList.remove('hidden')}

function computeAgePartsV2(dobString){
 const dob=new Date(dobString+'T00:00:00');if(Number.isNaN(dob.getTime()))return {years:0,months:0,days:0};
 const now=new Date();let years=now.getFullYear()-dob.getFullYear();let months=now.getMonth()-dob.getMonth();let days=now.getDate()-dob.getDate();
 if(days<0){months--;const prevMonthDays=new Date(now.getFullYear(),now.getMonth(),0).getDate();days+=prevMonthDays}
 if(months<0){years--;months+=12}return {years:Math.max(0,years),months:Math.max(0,months),days:Math.max(0,days)};
}
function calculateAgeFromDobV2(){const el=document.getElementById('regDob');if(!el||!el.value)return;regPatientDobV2=el.value;const a=computeAgePartsV2(el.value);['Years','Months','Days'].forEach(k=>{let x=document.getElementById('age'+k);if(x)x.value=a[k.toLowerCase()]})}
function calculateDobFromAgeV2(){const y=Math.max(0,Number(document.getElementById('ageYears')?.value||0)),m=Math.max(0,Number(document.getElementById('ageMonths')?.value||0)),d=Math.max(0,Number(document.getElementById('ageDays')?.value||0));let dt=new Date();dt.setDate(dt.getDate()-d);dt.setMonth(dt.getMonth()-m);dt.setFullYear(dt.getFullYear()-y);const iso=dt.toISOString().slice(0,10);regPatientDobV2=iso;let dob=document.getElementById('regDob');if(dob)dob.value=iso}
function ageCellLeaveV2(){calculateDobFromAgeV2()}

function regGrossV2(){return data.services.filter(x=>regServices.includes(x.id)).reduce((a,b)=>a+Number(b.price||0),0)}
function regDiscountAmountV2(){const gross=regGrossV2(),raw=Math.max(0,Number(regDiscountV2.amount||0));return regDiscountV2.type==='percent'?Math.min(gross,gross*Math.min(raw,100)/100):Math.min(gross,raw)}
function regPaidV2(){return regPaymentsV2.reduce((a,b)=>a+Number(b.amount||0),0)}
function regNetV2(){return Math.max(0,regGrossV2()-regDiscountAmountV2())}
function regRemainingV2(){return Math.max(0,regNetV2()-regPaidV2())}

function addRegistrationPaymentV2(){const method=data.paymentMethods.find(x=>x.id===selectedPaymentMethodV2),amount=Number(document.getElementById('regPaidInput')?.value||0),transaction=document.getElementById('regTransaction')?.value||'';if(!method||amount<=0){toast(dual('Enter a valid payment amount','أدخل مبلغ دفع صحيح'),'error');return}if(amount>regRemainingV2()+.001){toast(dual('Payment amount exceeds remaining balance','مبلغ الدفع يتجاوز الرصيد المتبقي'),'error');return}if(method.requiresTxn==='Yes'&&!transaction.trim()){toast(dual('Transaction number is required','رقم العملية مطلوب'),'error');return}regPaymentsV2.push({id:Date.now(),methodId:method.id,amount,transaction});renderMain();toast(tr('addPayment'))}
