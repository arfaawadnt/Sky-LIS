function requestTreasuryPage(){return `${pageHead(tr('requestTreasury'),`${tr('setup')} / ${tr('treasuries')} / ${tr('requestTreasury')}`)}<div class="card" style="max-width:720px"><div class="card-body"><div class="info">${lang==='ar'?'يتم ربط طلب الخزينة بالجهاز الحالي وإرساله إلى المدير للموافقة.':'Treasury access is requested for the current device and sent to the manager for approval.'}</div><div class="form-grid"><div class="field"><label>${tr('regBranch')} *</label><select class="k-select"><option>${dual('Nasr City Branch','فرع مدينة نصر')}</option><option>${dual('Maadi Branch','فرع المعادي')}</option></select></div><div class="field"><label>${tr('treasury')} *</label><select class="k-select"><option>${dual('Main Cashier','الخزينة الرئيسية')}</option></select></div><div class="field span2"><label>${tr('deviceId')}</label><input class="k-input" value="DEV-A81F2-92C1" readonly></div></div><button class="btn btn-primary" onclick="toast(dual('Treasury request submitted','تم إرسال طلب الخزينة'))">${tr('request')}</button></div></div>`}
function profilePage(){return `${pageHead(tr('profile'),`${tr('account')} / ${tr('profile')}`,`<button class="btn btn-primary" onclick="toast(tr('success'))">${tr('save')}</button>`)}<div class="dash-grid"><div class="card"><div class="card-head"><div class="card-title">${tr('labDetails')}</div></div><div class="card-body"><div class="form-grid"><div class="field"><label>${lang==='ar'?'اسم المختبر':'Lab Name'}</label><input class="k-input" value="${tr('lab')}" readonly></div><div class="field"><label>${tr('country')}</label><input class="k-input" value="${dual('Egypt','مصر')}" readonly></div><div class="field"><label>${tr('managerName')}</label><input class="k-input" value="${dual('Ahmed Hassan','أحمد حسن')}"></div><div class="field"><label>${tr('managerMobile')}</label><input class="k-input" value="+20 100 781 2214"></div><div class="field span2"><label>${tr('email')}</label><input class="k-input" value="manager@alnoor.demo"></div></div></div></div><div class="card"><div class="card-head"><div class="card-title">${tr('credentials')}</div></div><div class="card-body"><div class="field"><label>${tr('username')}</label><input class="k-input" value="lab.admin"></div><div class="field"><label>${tr('newPassword')}</label><input class="k-input" type="password" placeholder="••••••••"></div><div class="field"><label>${tr('confirmPassword')}</label><input class="k-input" type="password" placeholder="••••••••"></div><button class="btn btn-secondary" onclick="showOtpReset()">${tr('updateCredentials')}</button></div></div></div>`}
function setupPage(key){let c=setupConfigs[key];if(!c)return `<div class="warn">Screen not configured.</div>`;let actions=c.noAdd?'':`<button class="btn btn-primary" onclick="openEditor('${key}')">＋ ${tr('add')} ${tr(c.title)}</button>`;return `${pageHead(tr(c.title),`${tr('setup')} / ${tr(c.title)}`,actions)}${key==='clinical'||key==='services'||key==='tests'||key==='sampleTypes'||key==='units'||key==='drugTypes'||key==='antibiotics'||key==='organisms'||key==='preparations'||key==='comments'?`<div class="info">${lang==='ar'?'تم توريث البيانات الأولية من بوابة الإدارة عند إنشاء العميل، ويمكن لإدارة المختبر تعديلها لاحقاً بشكل مستقل.':'Initial records are inherited from the Admin Portal when the client is created; the client then maintains its own independent copy.'}</div>`:''}<div class="card grid-card"><div class="toolbar"><div class="search-wrap"><span class="search-ico">⌕</span><input id="setupSearch" class="k-input" placeholder="${tr('searchPlaceholder')}" oninput="refreshSetupGrid('${key}')"></div><select id="setupStatus" class="k-select" onchange="refreshSetupGrid('${key}')"><option>${tr('allStatuses')}</option><option value="Active">${tr('active')}</option><option value="Inactive">${tr('inactive')}</option></select><div class="grow"></div><button class="btn btn-secondary">${tr('export')}</button></div><div id="setupGrid">${setupTable(key)}</div></div>`}
function setupTable(key){let c=setupConfigs[key],rows=[...data[c.data]],q=(document.getElementById('setupSearch')?.value||'').toLowerCase(),st=document.getElementById('setupStatus')?.value||tr('allStatuses');if(q)rows=rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));if(st==='Active'||st==='Inactive')rows=rows.filter(r=>r.status===st);return table(rows,c.cols,!c.sequence,key)}function refreshSetupGrid(k){document.getElementById('setupGrid').innerHTML=setupTable(k)}
function table(rows,cols,actions=true,mode=''){return `<div class="table-wrap"><table class="k-grid"><thead><tr>${cols.map(([k,l])=>`<th>${tr(l)}</th>`).join('')}${actions?`<th class="actions-cell">${tr('actions')}</th>`:''}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(([k,l])=>`<td data-label="${tr(l)}">${formatCell(r,k,l,mode)}</td>`).join('')}${actions?`<td class="actions-cell"><div class="row-actions">${actionButtons(r,mode)}</div></td>`:''}</tr>`).join('')}</tbody></table></div><div class="grid-foot"><span>${tr('showing')} ${rows.length} ${tr('of')} ${rows.length} ${tr('records')}</span><div class="pager"><button class="pagebtn">‹</button><button class="pagebtn active">1</button><button class="pagebtn">›</button></div></div>`}
function formatCell(r,k,label,mode){if(k==='status')return badge(r[k]);if(k==='price'||k==='total'||k==='paid'||k==='remaining')return `EGP ${r[k]}`;if(k==='seq')return `<input class="k-input" type="number" min="1" value="${r[k]}" style="width:80px;height:30px">`;let arKey=k+'Ar';return r[arKey]&&lang==='ar'?r[arKey]:(r[k]??'—')}
function badge(v){let low=String(v).toLowerCase(),cls=low==='active'||low==='paid'||low==='completed'||low==='approved'?'active':low==='inactive'?'inactive':low==='verified'||low==='reviewed'?'verified':'pending';let text=v;if(v==='Active')text=tr('active');else if(v==='Inactive')text=tr('inactive');else if(v==='Pending')text=tr('pending');else if(v==='Completed')text=dual('Completed','مكتمل');else if(v==='Open')text=dual('Open','مفتوح');else if(v==='Paid')text=dual('Paid','مدفوع');else if(v==='Approved')text=dual('Approved','مقبول');else if(v==='Reviewed')text=tr('review');else if(v==='Saved')text=tr('save');return `<span class="status ${cls}">${text}</span>`}
function actionButtons(r,mode){if(mode==='treasuryRequests')return r.status==='Pending'?`<button class="btn btn-sm btn-primary" onclick="approveReq(${r.id})">${tr('approve')}</button><button class="btn btn-sm btn-danger" onclick="rejectReq(${r.id})">${tr('reject')}</button>`:'<button class="row-btn">⋯</button>';if(mode==='payments')return `<button class="row-btn" title="${tr('makePayment')}" onclick="paymentDialog(${r.id})">＄</button><button class="row-btn" title="${tr('refund')}" onclick="refundDialog(${r.id})">↩</button>`;if(mode==='query')return `<button class="btn btn-sm btn-secondary" onclick="toast(tr('continueReg'));navigate('registration')">${tr('continueReg')}</button>`;if(mode==='worklist')return `<label class="remember"><input type="checkbox"> ${tr('exclude')}</label>`;if(current==='searchRegistration')return `<button class="row-btn" onclick="navigate('registration')">✎</button><button class="row-btn" onclick="sampleDialog(${r.id})">▥</button><button class="row-btn danger" onclick="cancelServiceDialog(${r.id})">⌫</button>`;if(current==='patients')return `<button class="row-btn" onclick="patientHistory(${r.id})">☷</button><button class="row-btn">✎</button>`;if(setupConfigs[mode])return `<button class="row-btn" onclick="openEditor('${mode}',${r.id})">✎</button><button class="row-btn danger" onclick="deleteSetup('${mode}',${r.id})">⌫</button>`;return '<button class="row-btn">⋯</button>'}
function openEditor(key,id=null){let c=setupConfigs[key],row=id?data[c.data].find(x=>x.id===id):{};editing={key,id};let fields=(c.fields||[]).map(f=>fieldControl(f,row)).join('');document.getElementById('modal').innerHTML=`<div class="modal ${key==='tests'||key==='services'||key==='pricelists'?'wide':''}"><div class="modal-head"><h3>${id?tr('edit'):tr('add')} ${tr(c.title)}</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">${fields}</div></div><div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-primary" onclick="saveEditor()">${tr('save')}</button></div></div>`;document.getElementById('modal').classList.remove('hidden')}
function fieldControl(f,row){let [key,label,type,required,options]=f,v=row[key]||'';let control='';if(['text','email','date'].includes(type))control=`<input class="k-input editor" data-key="${key}" type="${type}" value="${v}">`;else if(type==='textarea')control=`<textarea class="k-textarea editor" data-key="${key}">${v}</textarea>`;else if(type==='select')control=`<select class="k-select editor" data-key="${key}"><option value="">${tr('select')}</option>${options.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;else if(type==='toggle')control=`<div class="switch-row"><span>${v==='Inactive'?tr('inactive'):tr('active')}</span><div class="switch editor-switch ${v==='Inactive'?'':'on'}" data-key="${key}" onclick="toggleSwitch(this)"></div></div>`;else if(type==='multi')control=`<div class="multi"><span class="chip">${dual('All Branches','كل الفروع')}</span><span class="chip">${dual('Nasr City','مدينة نصر')}</span></div>`;else if(type==='modules')control=`<div class="module-grid span2">${[['Registration','التسجيل'],['Results','النتائج'],['Patients','المرضى'],['Payments','المدفوعات'],['Setup','الإعدادات'],['Worklist','قائمة العمل']].map((m,i)=>`<div class="module-card"><div><strong>${dual(m[0],m[1])}</strong><p>${dual('Module access and actions','صلاحيات الوحدة والإجراءات')}</p></div><div class="switch ${i<4?'on':''}" onclick="toggleSwitch(this)"></div></div>`).join('')}</div>`;else if(type==='testconfig')control=`<div class="span2"><div class="info">${dual('Test configuration changes dynamically for Numeric, Non-numeric, Optional/Restricted List, Formula, Culture and Formatted Text types.','تتغير إعدادات التحليل ديناميكياً حسب النوع: رقمي، غير رقمي، قوائم، معادلة، مزرعة أو نص منسق.')}</div><div class="form-grid"><div class="field"><label>${dual('Normal Low','الحد الطبيعي الأدنى')}</label><input class="k-input" value="12"></div><div class="field"><label>${dual('Normal High','الحد الطبيعي الأعلى')}</label><input class="k-input" value="16"></div></div></div>`;else if(type==='pricegrid')control=`<div class="span2"><div class="section-title">${tr('services')}</div><div class="table-wrap"><table class="k-grid" style="min-width:0"><thead><tr><th>${tr('service')}</th><th>${tr('code')}</th><th>${tr('price')}</th></tr></thead><tbody>${data.services.map(s=>`<tr><td>${dual(s.name,s.nameAr)}</td><td>${s.short}</td><td><input class="k-input" style="width:110px;height:31px" value="${s.price}"></td></tr>`).join('')}</tbody></table></div></div>`;return `<div class="field ${type==='modules'||type==='testconfig'||type==='pricegrid'?'span2':''}" data-required="${required?1:0}"><label>${tr(label)}${required?' <span class="req">*</span>':''}</label>${control}<div class="validation">${tr(label)} ${tr('required')}</div></div>`}
function toggleSwitch(x){x.classList.toggle('on');let s=x.previousElementSibling;if(s)s.textContent=x.classList.contains('on')?tr('active'):tr('inactive')}
function saveEditor(){let c=setupConfigs[editing.key],obj={},valid=true;document.querySelectorAll('#modal .field[data-required="1"]').forEach(w=>{let f=w.querySelector('.editor');if(f&&!f.value.trim()){w.classList.add('invalid');valid=false}else w.classList.remove('invalid')});if(!valid){toast(dual('Please complete mandatory fields','يرجى استكمال الحقول الإلزامية'),'error');return}document.querySelectorAll('#modal .editor').forEach(x=>obj[x.dataset.key]=x.value);document.querySelectorAll('#modal .editor-switch').forEach(x=>obj[x.dataset.key]=x.classList.contains('on')?'Active':'Inactive');let arr=data[c.data];if(editing.id){let i=arr.findIndex(x=>x.id===editing.id);arr[i]={...arr[i],...obj}}else{obj.id=Math.max(0,...arr.map(x=>x.id))+1;if(!obj.status)obj.status='Active';arr.unshift(obj)}closeModal();renderMain();toast(tr('success'))}
function deleteSetup(key,id){let c=setupConfigs[key];data[c.data]=data[c.data].filter(x=>x.id!==id);renderMain();toast(tr('delete'))}
function approveReq(id){let r=data.treasuryRequests.find(x=>x.id===id);r.status='Approved';renderMain();toast(tr('approve'))}function rejectReq(id){let r=data.treasuryRequests.find(x=>x.id===id);r.status='Rejected';renderMain();toast(tr('reject'))}
function paymentDialog(id){let r=data.payments.find(x=>x.id===id);openSimple(tr('makePayment'),`<div class="field"><label>${tr('remaining')}</label><input class="k-input" value="EGP ${r.remaining}" readonly></div><div class="field"><label>${tr('paid')}</label><input class="k-input" value="${r.remaining}"></div><div class="field"><label>${tr('method')}</label><select class="k-select"><option>${tr('cash')}</option><option>${tr('card')}</option></select></div>`,tr('addPayment'))}
function refundDialog(id){openSimple(tr('refund'),`<div class="warn">${dual('Refund is allowed only for eligible pending services and cannot exceed the refundable amount.','يسمح بالاسترداد فقط للخدمات المعلقة المؤهلة وبحد أقصى المبلغ القابل للاسترداد.')}</div><div class="field"><label>${dual('Refund Amount','مبلغ الاسترداد')}</label><input class="k-input" value="100"></div><div class="field"><label>${dual('Reason for Refund','سبب الاسترداد')}</label><textarea class="k-textarea"></textarea></div>`,tr('refund'))}
function sampleDialog(id){openSimple(tr('sample'),`<div class="info">${tr('accession')}: ${data.registrations.find(x=>x.id===id).acc}</div><table class="k-grid" style="min-width:0"><thead><tr><th>${tr('sample')}</th><th>${tr('type')}</th><th>${tr('status')}</th><th>${tr('print')}</th></tr></thead><tbody><tr><td>S26090288</td><td>${dual('EDTA Blood','دم EDTA')}</td><td>${badge('Pending')}</td><td><button class="btn btn-sm btn-secondary">${tr('print')}</button></td></tr></tbody></table>`,tr('save'))}
function cancelServiceDialog(id){openSimple(dual('Cancel Service','إلغاء خدمة'),`<div class="warn">${dual('Select one or more services and provide a cancellation reason. Related samples will be canceled.','اختر خدمة أو أكثر وحدد سبب الإلغاء. سيتم إلغاء العينات المرتبطة.')}</div><label class="remember"><input type="checkbox" checked> ${dual('Complete Blood Count','صورة دم كاملة')}</label><div class="field" style="margin-top:12px"><label>${dual('Cancellation Reason','سبب الإلغاء')}</label><textarea class="k-textarea"></textarea></div>`,dual('Cancel Selected Services','إلغاء الخدمات المختارة'))}
function patientHistory(id){let p=data.patients.find(x=>x.id===id);openSimple(`${tr('visits')} • ${dual(p.name,p.nameAr)}`,`<table class="k-grid" style="min-width:0"><thead><tr><th>${tr('accession')}</th><th>${tr('date')}</th><th>${tr('status')}</th></tr></thead><tbody><tr><td>2609020017</td><td>02 Sep 2026</td><td>${badge('Completed')}</td></tr><tr><td>2607150022</td><td>15 Jul 2026</td><td>${badge('Completed')}</td></tr></tbody></table>`,tr('close'))}
function openSimple(title,body,action){let m=document.getElementById('modal');m.innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-primary" onclick="closeModal();toast('${action}')">${action}</button></div></div>`;m.classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML='';editing=null}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function toast(msg,type='success'){let x=document.createElement('div');x.className='toast '+(type==='error'?'error':'');x.innerHTML=`<div>${type==='error'?'!':'✓'}</div><div><strong>${msg}</strong><span>${type==='error'?dual('Please review the entered data.','يرجى مراجعة البيانات المدخلة.'):dual('Prototype action completed.','تم تنفيذ الإجراء في النموذج التفاعلي.')}</span></div>`;document.getElementById('toasts').appendChild(x);setTimeout(()=>x.remove(),3200)}
function logout(){hideProfile();showOnly('authPage');renderAuth('login')}
renderAuth('login');
</script>
</body>
