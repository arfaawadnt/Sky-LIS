<style>
/* Sky LIS prototype design system — colours derived from the Sky LIS logo (blue→violet gradient, navy wordmark, red specimen) */
:root{
  --blue:#2A7DF5;--blue-2:#1C63D6;--blue-3:#1549A8;--violet:#6E3BE4;--violet-2:#5B2ACB;--navy:#0B2A5B;--navy-2:#10336E;--cyan:#27B4F0;--red:#C8102E;
  --grad:linear-gradient(90deg,#2A7DF5 0%,#6E3BE4 100%);--grad-soft:linear-gradient(90deg,#E8F1FE,#EFE9FD);
  --ink:#14213A;--ink-2:#3C4A63;--muted:#6B7A90;--line:#DCE3EE;--line-soft:#EAEFF6;--bg:#F3F6FB;--surface:#FFFFFF;--surface-2:#F7F9FD;
  --blue-soft:#E8F1FE;--violet-soft:#EFE9FD;--ok:#13865A;--ok-soft:#E3F5EC;--warn:#B26B00;--warn-soft:#FFF3DF;--bad:#C8102E;--bad-soft:#FCE8EB;--info:#1C63D6;--info-soft:#E8F1FE;--panic:#7A0C1D;--panic-soft:#F6D5DA;
  --r:10px;--r-lg:14px;--r-sm:7px;--sh:0 1px 2px rgba(11,42,91,.06),0 10px 28px -14px rgba(11,42,91,.22);--sh-lg:0 24px 60px -24px rgba(11,42,91,.45);
  --sidebar-w:268px;--topbar-h:60px;--font:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,-apple-system,Roboto,Arial,sans-serif;--mono:"Cascadia Mono",Consolas,"JetBrains Mono",monospace;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
[dir=rtl] body{letter-spacing:0}
a{color:var(--blue-2)}button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono)}.nowrap{white-space:nowrap}.right{text-align:end}.center{text-align:center}
.grow{flex:1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}.gap{gap:14px}.mt{margin-top:14px}.mb{margin-bottom:14px}
.ic{vertical-align:-3px;flex:none}

/* ---------- auth & public ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{background:linear-gradient(160deg,#0B2A5B 0%,#1C63D6 55%,#6E3BE4 100%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art::after{content:"";position:absolute;inset:auto -120px -160px auto;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.08)}
.auth-art .logo-card{background:#fff;border-radius:16px;padding:14px 18px;display:inline-block;width:260px}
.auth-art h1{font-size:30px;line-height:1.2;margin:0 0 10px;max-width:22ch}.auth-art p{opacity:.9;max-width:52ch;font-size:15px}
.auth-art .pills{display:flex;gap:8px;flex-wrap:wrap}.auth-art .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-size:12px}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.auth-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:30px}
.auth-card h2{margin:0 0 4px;color:var(--navy);font-size:22px}.auth-card .sub{color:var(--muted);margin-bottom:18px}
.lab-lockup{display:flex;align-items:center;gap:12px;margin-bottom:18px}.lab-lockup .mark{width:44px;height:44px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700}
.public-nav{display:flex;justify-content:space-between;align-items:center;padding:14px 32px;background:var(--surface);border-bottom:1px solid var(--line)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding:64px 32px;max-width:1180px;margin:auto}
.hero h1{font-size:40px;line-height:1.15;color:var(--navy);margin:8px 0 14px}.hero p{font-size:16px;color:var(--ink-2);max-width:54ch}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);font-weight:700}
.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:20px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 32px 64px;max-width:1180px;margin:auto}
.feature{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}.feature .fi{width:40px;height:40px;border-radius:10px;background:var(--grad-soft);color:var(--violet);display:grid;place-items:center;margin-bottom:10px}
.steps{display:flex;gap:6px;margin:18px 0 22px}.step{flex:1;display:flex;align-items:center;gap:8px;padding:10px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.step.active{background:var(--blue-soft);border-color:#BBD3FA;color:var(--navy);font-weight:600}.step.done{color:var(--ok)}.step-dot{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;font-weight:700}
.step.active .step-dot{background:var(--grad);color:#fff}.step.done .step-dot{background:var(--ok);color:#fff}
.otp{display:flex;gap:8px;justify-content:center}.otp input{width:44px;height:50px;text-align:center;font-size:20px;border:1px solid var(--line);border-radius:var(--r-sm)}
.pass-rules{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}.pass-rules .ok{color:var(--ok)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.shell.collapsed{grid-template-columns:72px minmax(0,1fr)}
.sidebar{background:linear-gradient(180deg,#0B2A5B 0%,#0E2F66 60%,#1A2F6B 100%);color:#DCE6F7;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.sb-brand{padding:14px 14px 10px;display:flex;align-items:center;gap:10px}.sb-brand .logo-card{background:#fff;border-radius:12px;padding:6px 10px;flex:1;display:flex;align-items:center;justify-content:center}
.sb-brand img{height:44px;width:auto;display:block}.sb-tenant{padding:0 16px 10px;font-size:12px;color:#9FB4D8;border-bottom:1px solid rgba(255,255,255,.08)}.sb-tenant b{display:block;color:#fff;font-size:13px}
.sb-search{margin:10px 12px 4px;position:relative}.sb-search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:var(--r-sm);padding:7px 10px 7px 30px;font-size:12.5px}
[dir=rtl] .sb-search input{padding:7px 30px 7px 10px}.sb-search .ic{position:absolute;top:9px;inset-inline-start:9px;color:#9FB4D8}
.sb-scroll{overflow-y:auto;flex:1;padding:6px 10px 20px}.sb-scroll::-webkit-scrollbar{width:6px}.sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.nav-group{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8AA3CF;padding:14px 10px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:#DCE6F7;cursor:pointer;font-size:13.5px;margin:1px 0;transition:background .12s}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}.nav-item.active{background:var(--grad);color:#fff;box-shadow:0 6px 16px -8px rgba(110,59,228,.8)}
.nav-item .ic{opacity:.85}.nav-item .cnt{margin-inline-start:auto;background:rgba(255,255,255,.18);border-radius:999px;font-size:10.5px;padding:1px 7px}
.shell.collapsed .nav-item span.txt,.shell.collapsed .nav-group,.shell.collapsed .sb-tenant,.shell.collapsed .sb-search{display:none}.shell.collapsed .nav-item{justify-content:center}
.shell.collapsed .sb-brand img{height:30px}
.content{display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
.topbar h2{font-size:16px;margin:0;color:var(--navy);font-weight:700}.topbar .crumb{font-size:12px;color:var(--muted)}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:9px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}.icon-btn:hover{background:var(--surface-2);border-color:var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.pill.brand{background:var(--grad-soft);border-color:#CBD9F7;color:var(--navy);font-weight:600}
.profile{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px;border-radius:10px}.profile:hover{background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.profile .who{line-height:1.15}.profile .who b{display:block;font-size:13px}.profile .who span{font-size:11px;color:var(--muted)}
.menu-pop{position:fixed;top:64px;inset-inline-end:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);min-width:200px;padding:6px;z-index:60}
.menu-pop .mi{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}.menu-pop .mi:hover{background:var(--surface-2)}.menu-pop .mi.danger{color:var(--bad)}
.main{padding:22px 24px 48px;flex:1}.foot{padding:12px 24px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;background:var(--surface)}
.scrim{display:none}
.lang-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;display:inline-flex;gap:6px;align-items:center}

/* ---------- page ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:22px;margin:0;color:var(--navy)}.page-head .crumb{font-size:12px;color:var(--muted);margin-top:2px}.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.card-title{font-weight:700;color:var(--navy);font-size:14px}.card-sub{font-size:12px;color:var(--muted)}.card-body{padding:16px}.card+.card{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.kpi .lbl{font-size:12px;color:var(--muted)}.kpi .val{font-size:22px;font-weight:800;color:var(--navy);line-height:1.1;margin:4px 0}.kpi .hint{font-size:11px;color:var(--muted)}

const lab = l => l == null ? '' : (typeof l === 'string' && l.startsWith('=') ? l.slice(1) : t(l));

const L = (o, k = 'name') => !o ? '' : ((App.lang === 'ar' && o[k + 'Ar']) ? o[k + 'Ar'] : (o[k] ?? ''));

const pad = (n, w = 2) => String(n).padStart(w, '0');
const fmtDate = d => { if (!d) return '—'; const x = new Date(d); return `${pad(x.getDate())}/${pad(x.getMonth() + 1)}/${x.getFullYear()}`; };

const NOW = () => new Date('2026-10-08T14:30:00');
const hoursBetween = (a, b) => (new Date(b) - new Date(a)) / 36e5;
const fmtDur = h => { if (h == null || isNaN(h)) return '—'; const s = h < 0 ? '-' : ''; h = Math.abs(h); const d = Math.floor(h / 24), hh = Math.floor(h % 24), m = Math.round((h * 60) % 60); return s + (d ? d + 'D ' : '') + (hh ? hh + 'H ' : '') + m + 'Min'; };
const uid = (p = '') => p + Math.random().toString(36).slice(2, 8).toUpperCase();
const ageOf = dob => { if (!dob) return null; const b = new Date(dob), n = NOW(); let y = n.getFullYear() - b.getFullYear(), m = n.getMonth() - b.getMonth(), d = n.getDate() - b.getDate(); if (d < 0) { m--; d += 30; } if (m < 0) { y--; m += 12; } return { y, m, d }; };

/* ---------- badges & statuses ---------- */
const TONES = { Active: 'ok', Inactive: 'muted', Pending: 'warn', Approved: 'ok', Rejected: 'bad', Open: 'info', Completed: 'ok', Paid: 'ok', Partial: 'warn', Unpaid: 'bad', Ordered: 'muted', Collected: 'info', Received: 'violet', Complete: 'warn', Reviewed: 'info', Verified: 'ok', Printed: 'navy', Reserved: 'warn', Cancelled: 'bad', Delayed: 'bad', Running: 'ok', Stopped: 'bad', Error: 'bad', Draft: 'muted', Issued: 'ok', Locked: 'bad', Unlocked: 'ok', High: 'bad', Low: 'info', Normal: 'ok', Panic: 'panic', Booked: 'info', Converted: 'ok', Yes: 'ok', No: 'muted', Manual: 'muted', Subscription: 'violet', Valid: 'ok', Invalid: 'bad', Released: 'ok', Held: 'bad', Online: 'ok', Offline: 'bad', Sent: 'ok', Failed: 'bad', Read: 'ok' };

const flagBadge = f => !f || f === 'N' ? badge(t('fl_N'), 'ok') : f === 'H' ? badge(t('fl_H'), 'bad') : f === 'L' ? badge(t('fl_L'), 'info') : f === 'HH' ? badge(t('fl_HH'), 'panic') : f === 'LL' ? badge(t('fl_LL'), 'panic') : badge(f, 'warn');

/* ---------- layout helpers ---------- */
function pageHead(title, crumb, actions = '') { return `<div class="page-head"><div><h1>${title}</h1><div class="crumb">${crumb || ''}</div></div><div class="page-actions">${actions}</div></div>`; }
function card(o) { return `<div class="card ${o.cls || ''}">${o.title != null ? `<div class="card-head"><div><div class="card-title">${o.title}</div>${o.sub ? `<div class="card-sub">${o.sub}</div>` : ''}</div><div class="row">${o.actions || ''}</div></div>` : ''}<div class="card-body ${o.flush ? 'flush' : ''}" ${o.flush ? 'style="padding:0"' : ''}>${o.body || ''}</div></div>`; }
function kpi(label, value, hint, icon, tone = '') { return `<div class="card kpi ${tone}"><div><div class="lbl">${label}</div><div class="val">${value}</div><div class="hint">${hint || ''}</div></div><div class="kico">${ic(icon || 'activity', 18)}</div></div>`; }

function modal(o) { const m = el('#modalRoot'); m.innerHTML = `<div class="modal ${o.size || ''}" role="dialog"><div class="modal-head"><h3>${o.title}</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div><div class="modal-body" id="modalBody">${o.body}</div>${o.foot ? `<div class="modal-foot">${o.foot}</div>` : ''}</div>`; m.classList.add('show'); if (o.onOpen) setTimeout(o.onOpen, 0); }
function closeModal() { const m = el('#modalRoot'); m.classList.remove('show'); m.innerHTML = ''; App.editing = null; }
function confirmDlg(title, msg, onOk, danger) { window.__cb = onOk; modal({ title, size: 'sm', body: `<p>${msg}</p>`, foot: `<button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn ${danger ? 'danger' : 'primary'}" onclick="closeModal();window.__cb&&window.__cb()">${t('confirm')}</button>` }); }
function tabs(id, items, active) { return `<div class="tabs" id="${id}">${items.map(([k, l]) => `<button class="tab ${k === active ? 'active' : ''}" data-tab="${k}" onclick="switchTab('${id}','${k}')">${lab(l)}</button>`).join('')}</div>`; }
function pane(id, k, html, active) { return `<div class="tabpane ${active ? '' : 'hidden'}" data-for="${id}" data-tab="${k}">${html}</div>`; }
function switchTab(id, k) { const root = el('#' + id); if (!root) return; (App.store.activeTab = App.store.activeTab || {})[id] = k; root.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === k)); els(`.tabpane[data-for="${id}"]`).forEach(p => p.classList.toggle('hidden', p.dataset.tab !== k)); }
function barcode(code) { let s = String(code), bars = ''; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); bars += `<i style="width:${1 + (c % 3)}px;margin-right:${1 + ((c >> 2) % 2)}px"></i><i style="width:${1 + ((c >> 1) % 2)}px;margin-right:1px"></i>`; } return `<div class="barcode">${bars}</div><div class="mono small">${esc(code)}</div>`; }
function pct(v) { return `<div class="pct"><i style="width:${Math.max(0, Math.min(100, v))}%"></i></div>`; }

/* ---------- forms ---------- */
function field(f, v) {
  const val = (v && v[f.k] != null) ? v[f.k] : (f.val != null ? f.val : '');
  const req = f.req ? ' <span class="req">*</span>' : '';
  const lbl = `<label>${lab(f.l)}${req}</label>`;
  const attrs = `data-key="${f.k}" ${f.readonly ? 'readonly' : ''} ${f.onchange ? `onchange="${f.onchange}"` : ''} ${f.oninput ? `oninput="${f.oninput}"` : ''} ${f.ph ? `placeholder="${esc(lab(f.ph))}"` : ''} ${f.attrs || ''}`;
  const opts = typeof f.opts === 'function' ? f.opts() : (f.opts || []);
  let c = '';
  switch (f.type || 'text') {
    case 'select': c = `<select class="inp ed" ${attrs}><option value="">${t('select')}</option>${opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(val) === String(ov) ? 'selected' : ''}>${esc(typeof ol === 'function' ? ol() : ol)}</option>`; }).join('')}</select>`; break;
    case 'textarea': c = `<textarea class="inp ed" ${attrs} rows="${f.rows || 3}">${esc(val)}</textarea>`; break;
    case 'toggle': { const on = f.k === 'status' ? val !== 'Inactive' : (val === true || val === 'Yes' || val === 'true'); c = `<div class="switch-row"><div class="switch ed-toggle ${on ? 'on' : ''}" data-key="${f.k}" onclick="toggleSwitch(this)"></div><span class="small muted">${on ? (f.onLabel ? lab(f.onLabel) : t('enabled')) : (f.offLabel ? lab(f.offLabel) : t('disabled'))}</span></div>`; break; }
    case 'check': c = `<label class="check" style="min-height:36px"><input type="checkbox" class="ed" data-key="${f.k}" ${val === true || val === 'Yes' ? 'checked' : ''}> ${lab(f.text || f.l)}</label>`; break;
    case 'chips': { const vals = Array.isArray(val) ? val : String(val || '').split(',').map(x => x.trim()).filter(Boolean); c = `<div class="chips ed-chips" data-key="${f.k}">${opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<label><input type="checkbox" value="${esc(ov)}" ${vals.includes(ov) ? 'checked' : ''}>${esc(typeof ol === 'function' ? ol() : ol)}</label>`; }).join('')}</div>`; break; }
    case 'static': c = `<div class="inp" style="background:var(--surface-2)">${f.html || esc(val)}</div>`; break;
    case 'html': c = f.html || ''; break;
    default: c = `<input class="inp ed" type="${f.type || 'text'}" value="${esc(val)}" ${attrs} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.step != null ? `step="${f.step}"` : ''}>`;
  }
  return `<div class="field ${f.span ? 'span' + f.span : ''}" data-req="${f.req ? 1 : 0}">${lbl}${c}${f.help ? `<div class="help">${lab(f.help)}</div>` : ''}<div class="val-msg">${lab(f.l)} ${t('required')}</div></div>`;
}
function formGrid(fields, values, cols = '') { return `<div class="form-grid ${cols}">${fields.map(f => field(f, values)).join('')}</div>`; }
function readForm(root) { root = root || el('#modalBody'); const o = {}; root.querySelectorAll('.ed').forEach(e => { if (e.type === 'checkbox') o[e.dataset.key] = e.checked; else if (e.type === 'number') o[e.dataset.key] = e.value === '' ? '' : Number(e.value); else o[e.dataset.key] = e.value; }); root.querySelectorAll('.ed-toggle').forEach(e => { const on = e.classList.contains('on'); o[e.dataset.key] = e.dataset.key === 'status' ? (on ? 'Active' : 'Inactive') : on; }); root.querySelectorAll('.ed-chips').forEach(e => { o[e.dataset.key] = [...e.querySelectorAll('input:checked')].map(i => i.value); }); return o; }
function validateForm(root) { root = root || el('#modalBody'); let ok = true; root.querySelectorAll('.field[data-req="1"]').forEach(w => { const e = w.querySelector('.ed'); if (!e || e.type === 'checkbox') return; const bad = !String(e.value).trim(); w.classList.toggle('invalid', bad); if (bad) ok = false; }); if (!ok) toast(t('fillMandatory'), 'error'); return ok; }
function toggleSwitch(x) { x.classList.toggle('on'); const s = x.nextElementSibling; if (s && s.tagName === 'SPAN') s.textContent = x.classList.contains('on') ? t('enabled') : t('disabled'); }

/* ---------- grid ---------- */
function grid(o) {
  const cols = o.cols, rows = o.rows || [];
  const head = cols.map(c => `<th style="${c.w ? 'width:' + c.w : ''}" class="${c.cls || ''}">${lab(c.l)}</th>`).join('') + (o.actions ? `<th class="actions">${t('actions')}</th>` : '');
  const body = rows.length ? rows.map((r, i) => `<tr class="${o.rowClass ? o.rowClass(r) : ''} ${o.onRow ? 'clickable' : ''}" ${o.onRow ? `onclick="${o.onRow.replace('%id', r.id)}"` : ''} id="${o.id ? o.id + '-' + r.id : ''}">${cols.map(c => `<td class="${c.cls || ''}">${c.f ? c.f(r, i) : esc(L(r, c.k))}</td>`).join('')}${o.actions ? `<td class="actions" onclick="event.stopPropagation()">${o.actions(r)}</td>` : ''}</tr>`).join('') : `<tr><td colspan="${cols.length + (o.actions ? 1 : 0)}"><div class="empty">${o.empty || t('noResults')}</div></td></tr>`;
  const foot = o.nofoot ? '' : `<div class="grid-foot"><span>${t('showing')} ${rows.length} ${t('of')} ${o.total != null ? o.total : rows.length} ${t('records')}</span><div class="pager"><button>‹</button><button class="active">1</button><button>›</button></div></div>`;
  return `<div class="table-wrap"><table class="g ${o.compact ? 'compact' : ''}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${foot}`;
}
const rowBtn = (icon, title, onclick, cls = '') => `<button class="row-btn ${cls}" title="${esc(lab(title))}" onclick="${onclick}">${ic(icon, 14)}</button>`;

/* ---------- generic CRUD screens ---------- */
function crudState(key) { return App.store[key] || (App.store[key] = { q: '', st: '', extra: {} }); }
function crudPage(cfg) {
  const st = crudState(cfg.key);
  const rows = crudRows(cfg);
  const extra = (cfg.filters || []).map(f => `<select class="inp sm" onchange="crudFilter('${cfg.key}','${f.k}',this.value)"><option value="">${lab(f.l)}: ${t('all')}</option>${(typeof f.opts === 'function' ? f.opts() : f.opts).map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${st.extra[f.k] === ov ? 'selected' : ''}>${esc(typeof ol === 'function' ? ol() : ol)}</option>`; }).join('')}</select>`).join('');
  const actions = (cfg.canAdd === false ? '' : `<button class="btn primary" onclick="crudOpen('${cfg.key}')">${ic('plus')} ${t('add')} ${t(cfg.singular)}</button>`) + (cfg.headActions ? cfg.headActions() : '');
  return `${pageHead(t(cfg.title), cfg.crumb || `${t(cfg.group || 'setup')} / ${t(cfg.title)}`, actions)}${cfg.note ? `<div class="info">${lab(cfg.note)}</div>` : ''}${cfg.before ? cfg.before() : ''}
<div class="card"><div class="toolbar"><div class="search-wrap">${ic('search')}<input class="inp" placeholder="${t('searchPlaceholder')}" value="${esc(st.q)}" oninput="crudSearch('${cfg.key}',this.value)"></div>${cfg.noStatus ? '' : `<select class="inp sm" onchange="crudStatus('${cfg.key}',this.value)"><option value="">${t('allStatuses')}</option><option value="Active" ${st.st === 'Active' ? 'selected' : ''}>${t('st_Active')}</option><option value="Inactive" ${st.st === 'Inactive' ? 'selected' : ''}>${t('st_Inactive')}</option></select>`}${extra}<div class="grow"></div><button class="btn" onclick="toast(t('exported'),'ok')">${ic('download')} ${t('exportExcel')}</button></div><div id="crudGrid">${crudGrid(cfg, rows)}</div></div>${cfg.after ? cfg.after() : ''}`;
}
function crudRows(cfg) { const st = crudState(cfg.key); let rows = [...(cfg.rows ? cfg.rows() : DB[cfg.data])]; const q = st.q.toLowerCase(); if (q) rows = rows.filter(r => Object.values(r).some(v => typeof v !== 'object' && String(v).toLowerCase().includes(q))); if (st.st) rows = rows.filter(r => r.status === st.st); for (const [k, v] of Object.entries(st.extra)) if (v) rows = rows.filter(r => String(r[k]) === String(v)); return rows; }
function crudGrid(cfg, rows) {
  return grid({ cols: cfg.cols, rows, compact: cfg.compact, total: (cfg.rows ? cfg.rows() : DB[cfg.data]).length, rowClass: cfg.rowClass, actions: r => (cfg.rowActions ? cfg.rowActions(r) : '') + (cfg.canEdit === false ? '' : rowBtn('edit', 'edit', `crudOpen('${cfg.key}',${r.id})`)) + (cfg.canDelete === false ? '' : rowBtn('trash', 'delete', `crudDelete('${cfg.key}',${r.id})`, 'danger')) });
}
function crudRefresh(key) { const cfg = App.screens[key]; const g = el('#crudGrid'); if (g && cfg && cfg.data) g.innerHTML = crudGrid(cfg, crudRows(cfg)); }
function crudSearch(key, v) { crudState(key).q = v; crudRefresh(key); }
function crudStatus(key, v) { crudState(key).st = v; crudRefresh(key); }
function crudFilter(key, k, v) { crudState(key).extra[k] = v; crudRefresh(key); }
function crudOpen(key, id) {
  const cfg = App.screens[key]; const row = id ? DB[cfg.data].find(r => r.id === id) : {};
  App.editing = { key, id: id || null };
  if (!cfg.editor && !cfg.fields) return;
  const body = cfg.editor ? cfg.editor(row, !!id) : formGrid(typeof cfg.fields === 'function' ? cfg.fields(row) : cfg.fields, row, cfg.formCols || '');
  modal({ title: `${id ? t('edit') : t('add')} ${t(cfg.singular)}`, size: cfg.size || (cfg.wide ? 'lg' : ''), body, foot: `<button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="crudSave('${key}')">${ic('save')} ${id ? t('saveChanges') : t('add') + ' ' + t(cfg.singular)}</button>`, onOpen: cfg.onOpen ? () => cfg.onOpen(row, !!id) : null });
}
function crudSave(key) {
  const cfg = App.screens[key]; const root = el('#modalBody'); if (!validateForm(root)) return;
  let obj = cfg.read ? cfg.read(root) : readForm(root); if (obj === false) return;
  const arr = DB[cfg.data]; const id = App.editing.id;
  if (cfg.beforeSave) { const err = cfg.beforeSave(obj, id ? arr.find(r => r.id === id) : null); if (err) { toast(err, 'error'); return; } }
  if (id) { const i = arr.findIndex(r => r.id === id); arr[i] = { ...arr[i], ...obj }; } else { obj.id = Math.max(0, ...arr.map(r => r.id)) + 1; if (obj.status == null) obj.status = 'Active'; if (cfg.onCreate) cfg.onCreate(obj); arr.unshift(obj); }

function crudDelete(key, id) {
  const cfg = App.screens[key]; const row = DB[cfg.data].find(r => r.id === id);
  if (cfg.refCheck) { const msg = cfg.refCheck(row); if (msg) { toast(t('deleteBlocked'), 'error', msg); return; } }
  confirmDlg(`${t('delete')} ${t(cfg.singular)}`, `${t('confirmDelete')} <b>${esc(L(row) || row.code || row.id)}</b>? ${t('deleteHint')}`, () => { DB[cfg.data] = DB[cfg.data].filter(r => r.id !== id); renderMain(); toast(t('deleted'), 'ok'); }, true);
}

/* ---------- shell & navigation ---------- */
function renderShell() {
  el('#app').innerHTML = `<div class="shell ${App.collapsed ? 'collapsed' : ''}" id="shell"><aside class="sidebar" id="sidebar">${sidebarHtml()}</aside><div class="scrim" id="scrim" onclick="closeDrawer()"></div><div class="content"><header class="topbar">${topbarHtml()}</header><main class="main" id="main"></main><footer class="foot"><span>© 2026 National Technology · Sky LIS</span><span>${App.portal === 'admin' ? t('superAdminPortal') : t('clientPortal')} · ${t('prototype')} ${App.version}</span></footer></div></div><div class="menu-pop hidden" id="profileMenu"></div>`;
  renderMain();
}
function sidebarHtml() {
  const q = (App.store.navq || '').toLowerCase();
  return `<div class="sb-brand"><div class="logo-card"><img src="${LOGO}" alt="Sky LIS"></div></div>${App.tenant ? `<div class="sb-tenant"><b>${esc(L(App.tenant))}</b>${t('clientPortal')}</div>` : `<div class="sb-tenant"><b>National Technology</b>${t('superAdminPortal')}</div>`}
<div class="sb-search">${ic('search', 14)}<input placeholder="${t('filterMenu')}" value="${esc(App.store.navq || '')}" oninput="App.store.navq=this.value;el('#sidebar').innerHTML=sidebarHtml();el('#sidebar .sb-search input').focus()"></div>
<div class="sb-scroll">${App.nav.map(g => { const items = g.items.filter(i => !q || t(i.l).toLowerCase().includes(q)); if (!items.length) return ''; return `<div class="nav-group">${t(g.g)}</div>${items.map(i => `<div class="nav-item ${App.screen === i.k ? 'active' : ''}" onclick="navigate('${i.k}')" title="${esc(t(i.l))}">${ic(i.i || 'dot', 16)}<span class="txt">${t(i.l)}</span>${i.cnt ? `<span class="cnt">${i.cnt()}</span>` : ''}</div>`).join('')}`; }).join('')}</div>`;
}
function topbarHtml() {
  return `<button class="icon-btn mobile-only" onclick="openDrawer()">${ic('menu')}</button><button class="icon-btn desktop-only" onclick="toggleCollapse()" title="${t('collapseNav')}">${ic('menu')}</button><div><h2 id="topTitle">${screenTitle()}</h2></div><div class="grow"></div>
${App.branch ? `<span class="pill brand">${ic('pin', 13)} ${esc(L(App.branch))}</span>` : ''}${App.wallet != null ? `<span class="pill">${ic('wallet', 13)} ${t('walletBalance')}: ${money(App.wallet)}</span>` : ''}
<button class="lang-btn" onclick="setLang('${App.lang === 'en' ? 'ar' : 'en'}')">${ic('globe', 13)} ${App.lang === 'en' ? 'العربية' : 'English'}</button>
<button class="icon-btn" title="${t('notifications')}" onclick="showNotifications()">${ic('bell')}</button>
<div class="profile" onclick="toggleProfile(event)"><div class="avatar">${esc((App.user?.initials) || 'U')}</div><div class="who desktop-only"><b>${esc(L(App.user, 'name'))}</b><span>${esc(L(App.user, 'role'))}</span></div>${ic('chevdown', 14)}</div>`;
}
function screenTitle() { for (const g of App.nav) for (const i of g.items) if (i.k === App.screen) return t(i.l); const s = App.screens[App.screen]; return s && s.title ? t(s.title) : t('home'); }
function navigate(k, params) { if (!App.screens[k]) { toast(t('screenNotBuilt'), 'warn', k); return; } App.screen = k; App.params = params || {}; closeDrawer(); el('#sidebar').innerHTML = sidebarHtml(); const tt = el('#topTitle'); if (tt) tt.textContent = screenTitle(); renderMain(); window.scrollTo(0, 0); }
function renderMain() { const s = App.screens[App.screen]; const m = el('#main'); if (!m) return; try { m.innerHTML = typeof s === 'function' ? s(App.params) : crudPage(s); } catch (e) { console.error(e); m.innerHTML = `<div class="bad-strip">${esc(e.message)}</div>`; } }
function toggleCollapse() { App.collapsed = !App.collapsed; el('#shell').classList.toggle('collapsed', App.collapsed); }
function openDrawer() { el('#sidebar').classList.add('open'); el('#scrim').classList.add('show'); }
function closeDrawer() { const s = el('#sidebar'); if (s) s.classList.remove('open'); const sc = el('#scrim'); if (sc) sc.classList.remove('show'); }
function toggleProfile(e) { e.stopPropagation(); const m = el('#profileMenu'); m.innerHTML = `<div class="mi" onclick="navigate('profile');hideProfile()">${ic('user')} ${t('profile')}</div><div class="mi" onclick="hideProfile();toast(t('settings'),'ok')">${ic('settings')} ${t('settings')}</div><div class="mi" onclick="hideProfile();showShortcuts()">${ic('key')} ${t('keyboardShortcuts')}</div><div class="mi danger" onclick="logout()">${ic('logout')} ${t('logout')}</div>`; m.classList.toggle('hidden'); }
function hideProfile() { const m = el('#profileMenu'); if (m) m.classList.add('hidden'); }
document.addEventListener('click', hideProfile);
function setLang(l) { App.lang = l; document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; if (App.booted && !el('#app').classList.contains('hidden')) renderShell(); else if (typeof renderAuth === 'function') renderAuth(App.authMode || 'login'); }
function showNotifications() { modal({ title: t('notifications'), size: 'sm', body: `<ul class="timeline">${(DB.notifications || []).map(n => `<li><time>${esc(n.time)}</time><div><b>${esc(L(n, 'title'))}</b><div class="small muted">${esc(L(n, 'text'))}</div></div></li>`).join('') || `<li>${t('noResults')}</li>`}</ul>`, foot: `<button class="btn" onclick="closeModal()">${t('close')}</button>` }); }
function showShortcuts() { modal({ title: t('keyboardShortcuts'), size: 'sm', body: `<table class="g compact"><tbody>${[['Ctrl + S', t('ks_save')], ['Ctrl + K', t('ks_search')], ['Alt + N', t('ks_new')], ['F2', t('ks_lookup')], ['Esc', t('ks_close')]].map(([k, v]) => `<tr><td><span class="tag mono">${k}</span></td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`, foot: `<button class="btn" onclick="closeModal()">${t('close')}</button>` }); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if (e.ctrlKey && e.key.toLowerCase() === 's') { const b = el('#modalRoot.show .modal-foot .btn.primary'); if (b) { e.preventDefault(); b.click(); } } if (e.ctrlKey && e.key.toLowerCase() === 'k') { const i = el('#main .search-wrap input'); if (i) { e.preventDefault(); i.focus(); } } });
document.addEventListener('click', e => { if (e.target.id === 'modalRoot') closeModal(); });
function logout() { hideProfile(); App.booted = false; el('#app').classList.add('hidden'); if (typeof renderAuth === 'function') renderAuth('login'); }

/* ---------- report units (visit × clinical group) ---------- */
function unitsOfVisit(v) {
  const map = {};
  v.lines.filter(l => l.status !== 'Cancelled').forEach(l => {
    const s = svcById(l.service); if (!s) return; const svcs = s.type === 'Package' ? s.members.map(m => svcById(m.service)) : [s];
    svcs.forEach(ss => { if (!ss || ss.type === 'Additional') return; const key = ss.printAlone ? `g${ss.group}-s${ss.id}` : `g${ss.group}`; const u = map[key] = map[key] || { key: `${v.id}:${key}`, visit: v, group: ss.group, services: [], printAlone: ss.printAlone }; u.services.push({ service: ss, line: l }); });
  });
  Object.values(map).forEach(u => { const ids = u.services.map(x => x.service.id); u.results = DB.results.filter(r => r.visit === v.id && ids.includes(r.service)); u.reserved = u.services.every(x => x.line.status === 'Reserved'); u.status = u.results.length ? SCREEN_ORDER[Math.min(...u.results.map(r => stIdx(r.status)))] : 'Ordered'; u.printed = u.results.length > 0 && u.results.every(r => r.printed); u.samples = v.samples.filter(s => s.services.some(id => ids.includes(id))); u.received = u.samples.length > 0 && u.samples.every(s => s.status === 'Received'); u.abnormal = u.results.some(r => r.flag && r.flag !== 'N'); u.delta = u.results.some(r => r.delta); u.manual = !u.results.some(r => r.analyzer); u.analyzers = [...new Set(u.results.map(r => r.analyzer).filter(Boolean))]; });
  return Object.values(map);
}
const reportUnitsAll = () => DB.visits.flatMap(unitsOfVisit);
function unitColor(u) { const s = u.status, p = u.printed; if (u.reserved) return ['#FFF3B0', t('uc_reservedNP')]; if (s === 'Ordered') return p ? ['#1D3F8F', t('uc_incP')] : ['#FFD6E0', t('uc_incNP')]; if (s === 'Complete') return p ? ['#8E6CD6', t('uc_compP')] : ['#F28B82', t('uc_compNP')]; if (s === 'Reviewed') return p ? ['#F6B5C5', t('uc_revP')] : ['#C9F0D5', t('uc_revNP')]; if (s === 'Verified') return p ? ['#5FC48F', t('uc_verP')] : ['#2B2B2B', t('uc_verNP')]; return ['#5FC48F', t('uc_verP')]; }

  let n = 1; return Object.values(map).map(s => ({ id: `S${acc}${pad(n++, 2)}`, ...s, status: 'Ordered', events: [], labels: s.labels || 1, rejectReason: '' }));
}

function patientHistory(id) { const p = byId(DB.patients, id); const vs = DB.visits.filter(v => v.patient === id); modal({ title: `${esc(L(p))} · ${p.no}`, size: 'lg', body: `<div class="kv mb"><dt>${t('gender')}</dt><dd>${t(p.sex.toLowerCase())} · ${ageText(p.dob)}</dd><dt>${t('mobile')}</dt><dd>${p.mobile}</dd><dt>${t('patientCondition')}</dt><dd>${p.condition || '—'}</dd><dt>${t('receptionComments')}</dt><dd>${esc(p.comments || '—')}</dd></div>` + grid({ cols: [{ k: 'acc', l: 'accession', f: r => `<b>${r.acc}</b>` }, { k: 'date', l: 'date', f: r => fmtDT(r.date) }, { k: 'services', l: 'services', f: r => r.lines.map(l => svcById(l.service).short).join(', ') }, { k: 'payer', l: 'payer', f: r => esc(L(payerById(r.payer))) }, { k: 'bal', l: 'remaining', f: r => money(visitTotals(r).remaining) }, { k: 'status', l: 'status', f: r => sb(r.status) }], rows: vs, nofoot: true, actions: r => rowBtn('flask', 'results', `closeModal();navigate('resultsByAccession',{acc:'${r.acc}'})`) }), foot: `<button class="btn" onclick="closeModal()">${t('close')}</button>` }); }
function patientDocs(id) { const p = byId(DB.patients, id); p.docs = p.docs || [{ name: 'National ID.pdf', date: '2026-02-11', user: 'Mona Adel' }]; modal({ title: `${t('patientDocuments')} · ${p.no}`, size: 'sm', body: `<div class="info">${t('docsTenantWide')}</div>` + grid({ cols: [{ k: 'name', l: 'document' }, { k: 'date', l: 'date' }, { k: 'user', l: 'user' }], rows: p.docs.map((d, i) => ({ id: i, ...d })), nofoot: true }) + `<div class="row mt"><input class="inp" type="file"><button class="btn" onclick="byId(DB.patients,${id}).docs.push({name:'Prescription.pdf',date:today(),user:userName()});closeModal();patientDocs(${id});toast(t('attached'),'ok')">${ic('upload')} ${t('attach')}</button></div>`, foot: `<button class="btn" onclick="closeModal()">${t('close')}</button>` }); }
function mergeModal() { modal({ title: t('mergePatients'), size: 'sm', body: `<div class="warn-strip">${t('mergeWarn')}</div>` + formGrid([{ k: 'keep', l: 'survivingPatient', type: 'select', req: true, opts: DB.patients.map(p => [p.id, p.no + ' · ' + p.name]) }, { k: 'drop', l: 'duplicatePatient', type: 'select', req: true, opts: DB.patients.map(p => [p.id, p.no + ' · ' + p.name]) }], {}, ''), foot: `<button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn danger" onclick="(function(){const o=readForm();if(!o.keep||!o.drop||o.keep===o.drop)return toast(t('selectTwoPatients'),'error');DB.visits.filter(v=>String(v.patient)===o.drop).forEach(v=>v.patient=Number(o.keep));DB.patients=DB.patients.filter(p=>String(p.id)!==o.drop);audit('Patients merged',o.keep+' ← '+o.drop,'');closeModal();renderMain();toast(t('merged'),'ok')})()">${t('merge')}</button>` }); }
const PQ = { payer: 1, tier: 1, services: [] };
App.screens.priceQuery = () => { const rows = PQ.services.map(id => { const s = svcById(id); const p = priceFor(id, PQ.payer, PQ.tier); return { id, s, p }; }); const pt = rows.reduce((a, r) => a + r.p.patient, 0), py = rows.reduce((a, r) => a + r.p.payer, 0); return pageHead(t('priceQuery'), `${t('reception')} / ${t('priceQuery')}`, `<button class="btn" onclick="PQ.services=[];renderMain()">${t('clear')}</button><button class="btn" onclick="docQuote()">${ic('printer')} ${t('printQuote')}</button><button class="btn primary" onclick="regReset();Reg.visit.payer=PQ.payer;Reg.visit.tier=PQ.tier;PQ.services.forEach(s=>regAdd(s,true));navigate('registration')">${ic('arrow')} ${t('continueToRegistration')}</button>`) + `<div class="info">${t('priceQueryNote')}</div>` + card({ body: formGrid([{ k: 'payer', l: 'payer', type: 'select', opts: payerOpts, val: PQ.payer, onchange: 'PQ.payer=Number(this.value);PQ.tier=payerById(PQ.payer).tiers[0].id;renderMain()' }, { k: 'tier', l: 'contractTier', type: 'select', opts: payerById(PQ.payer).tiers.map(x => [x.id, () => L(x)]), val: PQ.tier, onchange: 'PQ.tier=Number(this.value);renderMain()' }, { k: 'svc', l: 'service', type: 'html', html: `<div class="row"><input class="inp" id="pqq" placeholder="${t('servicePlaceholder')}" onkeydown="if(event.key==='Enter'){pqFind(this.value);this.value=''}"><button class="btn" onclick="svcPicker(el('#pqq').value,id=>{if(!PQ.services.includes(id))PQ.services.push(id);renderMain()})">${ic('list')}</button></div>` }], {}, 'three') }) + card({ flush: true, body: grid({ cols: [{ k: 'short', l: 'shortName', f: r => `<b>${r.s.short}</b>` }, { k: 'name', l: 'service', f: r => esc(L(r.s)) }, { k: 'sample', l: 'sample', f: r => r.s.sample ? `${esc(L(stById(r.s.sample)))} · ${esc(r.s.condition)}` : '—' }, { k: 'base', l: 'listPrice', f: r => money(basePrice(r.id)) }, { k: 'pt', l: 'patientShare', f: r => money(r.p.patient) }, { k: 'py', l: 'payerShare', f: r => money(r.p.payer) }, { k: 'exp', l: 'expectedResult', f: r => fmtDT(expectedResultDate(NOW(), r.s.durationH)) }, { k: 'prep', l: 'preparation', f: r => r.s.precaution ? badge(r.s.precaution, 'warn') : '—' }], rows, nofoot: true, actions: r => rowBtn('trash', 'remove', `PQ.services=PQ.services.filter(x=>x!==${r.id});renderMain()`, 'danger') }) + `<div class="grid-foot"><span>${t('patientShare')}: <b>${money(pt)}</b> · ${t('payerShare')}: <b>${money(py)}</b></span><span>${t('total')}: <b>${money(pt + py)}</b></span></div>` }); };
function pqFind(q) { const byNo = DB.services.find(s => String(s.shortNo) === q.trim()); const m = byNo || DB.services.find(s => s.short.toLowerCase() === q.trim().toLowerCase()); if (m) { if (!PQ.services.includes(m.id)) PQ.services.push(m.id); renderMain(); } else svcPicker(q, id => { if (!PQ.services.includes(id)) PQ.services.push(id); renderMain(); }); }
function docQuote() { const rows = PQ.services.map(id => ({ s: svcById(id), p: priceFor(id, PQ.payer, PQ.tier) })); modal({ title: t('quote'), size: 'lg', body: `<div class="paper">${paperHead(t('priceQuote'))}<div class="kv"><dt>${t('payer')}</dt><dd>${esc(L(payerById(PQ.payer)))} / ${esc(L(tierOf(PQ.payer, PQ.tier)))}</dd><dt>${t('date')}</dt><dd>${fmtDT(NOW())}</dd></div><table><thead><tr><th>${t('service')}</th><th>${t('preparation')}</th><th>${t('expectedResult')}</th><th class="right">${t('patientShare')}</th><th class="right">${t('payerShare')}</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(L(r.s))}</td><td>${esc(r.s.precaution || '—')}</td><td>${fmtDT(expectedResultDate(NOW(), r.s.durationH))}</td><td class="right">${num(r.p.patient)}</td><td class="right">${num(r.p.payer)}</td></tr>`).join('')}</tbody></table><div class="right"><b>${t('total')}: ${money(rows.reduce((a, r) => a + r.p.patient, 0))}</b></div><p class="small">${t('quoteDisclaimer')}</p></div>`, foot: `<button class="btn" onclick="closeModal()">${t('close')}</button><button class="btn primary" onclick="toast(t('sentToPrinter'),'ok')">${ic('printer')} ${t('print')}</button>` }); }

/* app.client.2.js — Client Portal: samples, worklist, results, work queue, printing */
'use strict';
/* ---------- samples ---------- */
function sampleTransition(s, status, location) { s.status = status; s.events.push({ status, time: nowISO(), user: userName(), location: location || (status === 'Collected' ? 'Phlebotomy' : L(grp(s.group))) }); }
App.screens.collection = () => { const mode = App.store.scanMode || 'Collected'; const all = DB.visits.flatMap(v => v.samples.map(s => ({ ...s, v }))); const todayS = all.filter(x => isToday(x.v.date)); const cnt = st => todayS.filter(x => x.status === st).length;
  return pageHead(t('collectionReceipt'), `${t('samples')} / ${t('collectionReceipt')}`) + `<div class="grid2"><div>${card({ title: t('scanSample'), sub: t('scanSub'), body: `<div class="row mb"><label class="check"><input type="radio" name="sm" ${mode === 'Collected' ? 'checked' : ''} onchange="App.store.scanMode='Collected';renderMain()"> ${t('collectMode')}</label><label class="check"><input type="radio" name="sm" ${mode === 'Received' ? 'checked' : ''} onchange="App.store.scanMode='Received';renderMain()"> ${t('receiveMode')}</label></div><div class="scan"><input class="inp" id="scanId" placeholder="S2610080001" onkeydown="if(event.key==='Enter'){scanSample(this.value);this.value=''}"><button class="btn primary" onclick="scanSample(el('#scanId').value);el('#scanId').value=''">${ic('scan')} ${t('scan')}</button></div><div class="help">${t('scanHelp')}</div><div id="scanResult" class="mt"></div>` })}${card({ title: t('byAccession'), body: `<div class="scan"><input class="inp" id="scanAcc" placeholder="2610080001" onkeydown="if(event.key==='Enter')scanAcc(this.value)"><button class="btn" onclick="scanAcc(el('#scanAcc').value)">${ic('check')} ${mode === 'Collected' ? t('collectAll') : t('receiveAll')}</button></div><div class="help">${t('byAccessionHelp')}</div>` })}</div>
${card({ title: t('todaySamples'), sub: `${t('st_Ordered')}: ${cnt('Ordered')} · ${t('st_Collected')}: ${cnt('Collected')} · ${t('st_Received')}: ${cnt('Received')} · ${t('st_Rejected')}: ${cnt('Rejected')}`, flush: true, body: grid({ cols: [{ k: 'id', l: 'sampleId', f: r => `<span class="mono">${r.id}</span>` }, { k: 'acc', l: 'accession', f: r => `<b>${r.v.acc}</b>` }, { k: 'patient', l: 'patient', f: r => esc(L(patientOf(r.v))) }, { k: 'group', l: 'clinicalGroup', f: r => esc(L(grp(r.group))) }, { k: 'type', l: 'sample', f: r => `${esc(L(stById(r.sampleType)))} · ${esc(r.condition)}` }, { k: 'services', l: 'services', f: r => r.services.map(s => svcById(s).short).join(', ') }, { k: 'status', l: 'status', f: r => sb(r.status) }, { k: 'last', l: 'lastEvent', f: r => { const e = r.events[r.events.length - 1]; return e ? `${fmtDT(e.time).slice(11)} · ${esc(e.location)}` : '—'; } }], rows: todayS.map((x, i) => ({ ...x, id: x.id })), actions: r => (r.status === 'Ordered' ? `<button class="btn sm" onclick="scanSample('${r.id}')">${t('st_Collected')}</button>` : r.status === 'Collected' ? `<button class="btn sm primary" onclick="App.store.scanMode='Received';scanSample('${r.id}')">${t('st_Received')}</button>` : '') + rowBtn('clock', 'track', `trackModal('${r.id}')`) }) })}</div>`; };
function scanSample(id) { id = String(id || '').trim().toUpperCase(); const s = sampleById(id); const out = el('#scanResult'); if (!s) { toast(t('sampleNotFound'), 'error', id); return; } const v = visitOfSample(id); const mode = App.store.scanMode || 'Collected';
  if (s.status === 'Rejected') { toast(t('sampleRejectedScan'), 'error', s.rejectReason); return; }
  if (mode === 'Collected') { if (s.status !== 'Ordered') toast(t('alreadyStatus'), 'warn', t('st_' + s.status)); else { sampleTransition(s, 'Collected', 'Phlebotomy'); audit('Sample collected', id, ''); toast(t('markedCollected'), 'ok', id); } }
  else { if (s.status === 'Ordered') { sampleTransition(s, 'Collected', 'Phlebotomy'); } if (s.status === 'Received') toast(t('alreadyStatus'), 'warn', t('st_Received')); else { sampleTransition(s, 'Received', L(grp(s.group))); audit('Sample received', id, L(grp(s.group))); toast(t('markedReceived'), 'ok', id); } }
  if (out) out.innerHTML = `<div class="module-card"><div><b>${id}</b> · ${esc(L(patientOf(v)))} · ${v.acc}<p>${esc(L(grp(s.group)))} · ${esc(L(stById(s.sampleType)))} · ${esc(s.condition)} · ${s.services.map(x => svcById(x).short).join(', ')}</p></div>${sb(s.status)}</div>`; renderMain(); setTimeout(() => { const i = el('#scanId'); if (i) i.focus(); const o = el('#scanResult'); if (o && out) o.innerHTML = out.innerHTML; }, 0); }
function scanAcc(acc) { const v = visitByAcc(acc); if (!v) return toast(t('visitNotFound'), 'error'); const mode = App.store.scanMode || 'Collected'; v.samples.forEach(s => { if (s.status === 'Rejected') return; if (mode === 'Collected' && s.status === 'Ordered') sampleTransition(s, 'Collected', 'Phlebotomy'); if (mode === 'Received' && s.status !== 'Received') { if (s.status === 'Ordered') sampleTransition(s, 'Collected', 'Phlebotomy'); sampleTransition(s, 'Received', L(grp(s.group))); } }); renderMain(); toast(mode === 'Collected' ? t('markedCollected') : t('markedReceived'), 'ok', `${v.acc} · ${v.samples.length}`); }
App.screens.samplesByVisit = p => { const acc = p.acc || App.store.sbvAcc || ''; App.store.sbvAcc = acc; const v = acc ? visitByAcc(acc) : null; return pageHead(t('samplesByVisit'), `${t('samples')} / ${t('samplesByVisit')}`) + card({ body: `<div class="scan"><input class="inp" id="sbv" value="${esc(acc)}" placeholder="${t('accession')}" onkeydown="if(event.key==='Enter')navigate('samplesByVisit',{acc:this.value})"><button class="btn primary" onclick="navigate('samplesByVisit',{acc:el('#sbv').value})">${ic('search')} ${t('search')}</button></div>` }) + (v ? card({ title: `${v.acc} · ${esc(L(patientOf(v)))}`, actions: `<button class="btn sm" onclick="docLabels(${v.id})">${ic('printer', 14)} ${t('printLabels')}</button><button class="btn sm" onclick="docJobOrder(${v.id})">${ic('file', 14)} ${t('jobOrder')}</button>`, flush: true, body: grid({ cols: [{ k: 'id', l: 'sampleId', f: r => `<span class="mono">${r.id}</span>` }, { k: 'group', l: 'unit', f: r => `[${grp(r.group).unitCode}] ${esc(L(grp(r.group)))}` }, { k: 'type', l: 'sample', f: r => `${esc(L(stById(r.sampleType)))} · ${esc(r.condition)}` }, { k: 'status', l: 'status', f: r => sb(r.status) + (r.rejectReason ? ` <span class="small muted">${esc(r.rejectReason)}</span>` : '') }, { k: 'date', l: 'statusDate', f: r => fmtDT(r.events[r.events.length - 1]?.time) }, { k: 'labels', l: 'labels', f: r => r.labels + '×' }, { k: 'services', l: 'services', f: r => r.services.map(s => { const sv = svcById(s); return `<span class="tag">${sv.short} <span class="muted">(${t('svt_' + sv.type)})</span></span>`; }).join('') }], rows: v.samples, nofoot: true, actions: r => rowBtn('printer', 'printLabel', `modal({title:'${t('sampleLabels')}',size:'sm',body:labelHtml(byId(DB.visits,${v.id}),sampleById('${r.id}')),foot:'<button class=\\'btn primary\\' onclick=\\'closeModal();toast(t(\\"sentToPrinter\\"),\\"ok\\")\\'>${t('print')}</button>'})`) + rowBtn('clock', 'track', `trackModal('${r.id}')`) }) }) : (acc ? `<div class="bad-strip">${t('visitNotFound')}</div>` : '')); };
App.screens.rejectSample = () => pageHead(t('rejectUnreject'), `${t('samples')} / ${t('rejectUnreject')}`) + `<div class="grid2">${card({ title: t('rejectSample'), sub: t('rejectSub'), body: `<div class="scan mb"><input class="inp" id="rjId" placeholder="S2610080006" onkeydown="if(event.key==='Enter')rjLookup(this.value)"><button class="btn" onclick="rjLookup(el('#rjId').value)">${ic('search')} ${t('lookup')}</button></div><div id="rjInfo"></div>` })}${card({ title: t('unrejectReplace'), sub: t('unrejectSub'), body: `<div class="scan mb"><input class="inp" id="urId" placeholder="S…" onkeydown="if(event.key==='Enter')urLookup(this.value)"><button class="btn" onclick="urLookup(el('#urId').value)">${ic('search')} ${t('lookup')}</button></div><div id="urInfo"></div><div class="info mt">${DB.parameters.newBarcodeOnReject ? t('policyNewBarcode') : t('policySameBarcode')}</div>` })}</div>` + card({ title: t('rejectedSamples'), flush: true, body: grid({ cols: [{ k: 'id', l: 'sampleId', f: r => `<span class="mono">${r.id}</span>` }, { k: 'acc', l: 'accession', f: r => r.v.acc }, { k: 'patient', l: 'patient', f: r => esc(L(patientOf(r.v))) }, { k: 'reason', l: 'reason', f: r => badge(r.rejectReason, 'bad') }, { k: 'when', l: 'date', f: r => fmtDT(r.events[r.events.length - 1]?.time) }, { k: 'by', l: 'user', f: r => esc(r.events[r.events.length - 1]?.user) }], rows: DB.visits.flatMap(v => v.samples.filter(s => s.status === 'Rejected').map(s => ({ ...s, v }))), nofoot: true }) });
function rjLookup(id) { id = id.trim().toUpperCase(); const s = sampleById(id); const box = el('#rjInfo'); if (!s) return box.innerHTML = `<div class="bad-strip">${t('sampleNotFound')}</div>`; const v = visitOfSample(id); if (s.status === 'Rejected') return box.innerHTML = `<div class="warn-strip">${t('alreadyRejected')} · ${esc(s.rejectReason)}</div>`; box.innerHTML = `<div class="kv mb"><dt>${t('accession')}</dt><dd>${v.acc}</dd><dt>${t('patient')}</dt><dd>${esc(L(patientOf(v)))}</dd><dt>${t('sample')}</dt><dd>${esc(L(stById(s.sampleType)))} · ${esc(s.condition)} · ${s.services.map(x => svcById(x).short).join(', ')}</dd><dt>${t('status')}</dt><dd>${sb(s.status)}</dd></div><div class="field"><label>${t('rejectionReason')} <span class="req">*</span></label><select class="inp" id="rjReason"><option value="">${t('select')}</option>${reasonOpts('Rejection').map(([v2, l]) => `<option value="${v2}">${esc(l())}</option>`).join('')}</select></div><button class="btn danger mt" onclick="rjConfirm('${id}')">${ic('slash')} ${t('rejectSample')}</button>`; }
function rjConfirm(id) { const reason = el('#rjReason').value; if (!reason) return toast(t('selectReason'), 'error'); confirmDlg(t('rejectSample'), t('rejectConfirm') + ` <b>${id}</b>?`, () => { const s = sampleById(id); s.status = 'Rejected'; s.rejectReason = reason; s.events.push({ status: 'Rejected', time: nowISO(), user: userName(), location: L(grp(s.group)) + ' · ' + reason }); audit('Sample rejected', id, reason); renderMain(); toast(t('sampleRejected'), 'warn', `${id} · ${reason} · ${t('notifyRecollect')}`); }, true); }
function urLookup(id) { id = id.trim().toUpperCase(); const s = sampleById(id); const box = el('#urInfo'); if (!s) return box.innerHTML = `<div class="bad-strip">${t('sampleNotFound')}</div>`; if (s.status !== 'Rejected') return box.innerHTML = `<div class="warn-strip">${t('notRejected')} · ${sb(s.status)}</div>`; box.innerHTML = `<div class="kv mb"><dt>${t('sample')}</dt><dd>${id} · ${esc(s.rejectReason)}</dd></div><div class="row"><button class="btn" onclick="unreject('${id}')">${ic('undo')} ${t('unrejectSameBarcode')}</button><button class="btn primary" onclick="replaceSample('${id}')">${ic('plus')} ${t('issueNewSample')}</button></div>`; }

  return rows.filter(x => { if (f.from && (!x.collected || x.collected < f.from)) return false; if (f.to && x.collected && x.collected.slice(0, 10) > f.to) return false; if (f.group && String(x.group) !== String(f.group)) return false; if (f.test && String(x.tst.id) !== String(f.test)) return false; if (f.analyzer && !x.analyzers.includes(Number(f.analyzer))) return false; if (f.sampleStatus && x.sampleStatus !== f.sampleStatus) return false; if (f.payer && String(x.v.payer) !== String(f.payer)) return false; const b = f.boxes || {}; const any = Object.values(b).some(Boolean); if (!any) return true; return (b.newTests && x.status === 'Ordered') || (b.remaining && stIdx(x.status) < 3) || (b.completed && x.status === 'Complete') || (b.manual && x.manual) || (b.notVerified && stIdx(x.status) < 3) || (b.notPrinted && !x.printed) || (b.incomplete && x.status === 'Ordered') || (b.printed && x.printed) || (b.delayed && x.delay > 0 && stIdx(x.status) < 3); });

function wqBulk(status) { if (!WQ.rows.length) return; let n = 0; WQ.rows.forEach(u => { u.results.filter(r => r.value !== '' && stIdx(r.status) < stIdx(status)).forEach(r => { r.status = status; r.statusLog.push({ status, time: nowISO(), user: userName() }); n++; }); }); audit('Bulk ' + status, `${WQ.rows.length} reports`, `${n} results`); renderMain(); toast(`${t('st_' + status)} · ${n} ${t('results')}`, n ? 'ok' : 'warn', t('bulkWarn')); }

function refundModal(id) { const v = byId(DB.visits, id); const tot = visitTotals(v); const refundable = Math.max(0, -tot.remaining); modal({ title: `${t('refund')} · ${v.acc}`, size: 'sm', body: `<div class="${refundable ? 'warn-strip' : 'info'}">${t('refundableAmount')}: <b>${money(refundable)}</b> · ${t('refundRule')}</div>` + formGrid([{ k: 'amount', l: 'refundAmount', type: 'number', req: true, val: refundable }, { k: 'method', l: 'paymentMethod', type: 'select', req: true, opts: [['Cash', () => t('cash')], ['Card', () => t('card')]], val: 'Cash' }, { k: 'reason', l: 'refundReason', type: 'select', req: true, opts: reasonOpts('Refund'), span: 2 }], {}), foot: `<button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn danger" ${refundable ? '' : 'disabled'} onclick="refundSave(${id})">${ic('undo')} ${t('refund')}</button>` }); }

/* ---------- money transfer ---------- */

App.screens.moneyTransfer = () => { const v = MT.visitId ? byId(DB.visits, MT.visitId) : null; return pageHead(t('moneyTransfer'), `${t('finance')} / ${t('moneyTransfer')}`) + `<div class="info">${t('transferNote')}</div>` + card({ body: visitPicker('mtq', 'mtLookup') }) + (v ? (() => { const tot = visitTotals(v); const np = MT.payer || v.payer, nt = MT.tier || v.tier; const preview = v.lines.filter(l => l.status !== 'Cancelled').map(l => ({ l, p: priceFor(l.service, np, nt) })); const newPt = preview.reduce((s, x) => s + x.p.patient, 0), newPy = preview.reduce((s, x) => s + x.p.payer, 0);
  return `<div class="card"><div class="card-head"><div class="card-title">${v.acc} · ${esc(L(patientOf(v)))}</div><div class="card-sub">${t('currentContract')}: <b>${esc(L(payerById(v.payer)))} / ${esc(L(tierOf(v.payer, v.tier)))}</b> · ${t('patientShare')} ${money(tot.patientShare)} · ${t('totalPaid')} ${money(tot.paid)}</div></div><div class="card-body">${tabs('mtTabs', [['rank', 'contractTransfer'], ['normal', 'lineTransfer']], 'rank')}${pane('mtTabs', 'rank', `<div class="form-grid">${field({ k: 'np', l: 'newPayer', type: 'select', opts: payerOpts(), val: np, onchange: 'MT.payer=Number(this.value);MT.tier=payerById(MT.payer).tiers[0].id;renderMain()' })}${field({ k: 'nt', l: 'newTier', type: 'select', opts: payerById(np).tiers.map(x => [x.id, () => L(x)]), val: nt, onchange: 'MT.tier=Number(this.value);renderMain()' })}</div><div class="table-wrap mt"><table class="g compact"><thead><tr><th>${t('service')}</th><th class="right">${t('currentPatient')}</th><th class="right">${t('currentPayer')}</th><th class="right">${t('newPatient')}</th><th class="right">${t('newPayer')}</th></tr></thead><tbody>${preview.map(x => `<tr><td>${esc(L(svcById(x.l.service)))}</td><td class="right">${num(x.l.patient)}</td><td class="right">${num(x.l.payer)}</td><td class="right"><b>${num(x.p.patient)}</b></td><td class="right"><b>${num(x.p.payer)}</b></td></tr>`).join('')}</tbody></table></div><div class="row mt" style="justify-content:space-between"><div>${t('newPatientShare')}: <b>${money(newPt - tot.discount)}</b> · ${t('newPayerShare')}: <b>${money(newPy)}</b> · ${t('resultingBalance')}: <b class="${newPt - tot.discount - tot.paid + tot.refunded < 0 ? 'muted' : ''}">${money(newPt - tot.discount - tot.paid + tot.refunded)}</b></div><button class="btn primary" onclick="mtApply(${v.id})" ${np === v.payer && nt === v.tier ? 'disabled' : ''}>${ic('repeat')} ${t('applyTransfer')}</button></div>`, true)}${pane('mtTabs', 'normal', `<div class="help mb">${t('lineTransferHelp')}</div><div class="table-wrap"><table class="g compact"><thead><tr><th>${t('service')}</th><th>${t('listPatient')}</th><th>${t('listPayer')}</th><th>${t('actualPatient')}</th><th>${t('actualPayer')}</th></tr></thead><tbody>${v.lines.filter(l => l.status !== 'Cancelled').map(l => { const p = priceFor(l.service, v.payer, v.tier); return `<tr><td>${esc(L(svcById(l.service)))}</td><td>${num(p.patient)}</td><td>${num(p.payer)}</td><td><input class="inp sm" type="number" value="${l.patient}" onchange="mtLine(${v.id},${l.id},'patient',this.value)"></td><td><input class="inp sm" type="number" value="${l.payer}" onchange="mtLine(${v.id},${l.id},'payer',this.value)"></td></tr>`; }).join('')}</tbody></table></div>`)}</div></div>`; })() : ''); };
function mtLookup(q) { const v = findVisits(q)[0]; if (!v) return toast(t('visitNotFound'), 'error'); MT.visitId = v.id; MT.payer = v.payer; MT.tier = v.tier; renderMain(); }
function mtApply(id) { const v = byId(DB.visits, id); const old = `${L(payerById(v.payer))}/${L(tierOf(v.payer, v.tier))}`; v.payer = MT.payer; v.tier = MT.tier; v.lines.forEach(l => { const p = priceFor(l.service, v.payer, v.tier); l.patient = p.patient; l.payer = p.payer; }); v.transfers.push({ time: nowISO(), user: userName(), from: old, to: `${L(payerById(v.payer))}/${L(tierOf(v.payer, v.tier))}` }); audit('Contract transfer', v.acc, `${old} → ${L(payerById(v.payer))}`); renderMain(); const rem = visitTotals(v).remaining; toast(t('transferApplied'), 'ok', rem < 0 ? `${t('refundDue')} ${money(-rem)}` : rem > 0 ? `${t('remaining')} ${money(rem)}` : ''); }
function mtLine(vid, lid, k, val) { const v = byId(DB.visits, vid); const l = v.lines.find(x => x.id === lid); l[k] = Number(val); audit('Line value transfer', v.acc, `${svcById(l.service).short} ${k} = ${val}`); toast(t('saved'), 'ok'); }

App.screens.cancellations = () => { const rows = DB.visits.filter(v => v.lines.some(l => l.status === 'Cancelled')); return pageHead(t('cancellations'), `${t('finance')} / ${t('cancellations')}`) + `<div class="info">${t('cancelNote')}</div>` + card({ body: visitPicker('cnq', 'cancelLookup') }) + card({ title: t('cancelledServices'), flush: true, body: grid({ cols: [{ k: 'acc', l: 'accession', f: r => `<b>${r.acc}</b>` }, { k: 'patient', l: 'patient', f: r => esc(L(patientOf(r))) }, { k: 'lines', l: 'cancelledServices', f: r => r.lines.filter(l => l.status === 'Cancelled').map(l => `<span class="tag">${svcById(l.service).short} · ${esc(l.cancelReason || '')}</span>`).join('') }, { k: 'by', l: 'user', f: r => esc(r.lines.find(l => l.status === 'Cancelled')?.cancelUser || '') }, { k: 'bal', l: 'balance', f: r => money(visitTotals(r).remaining) }], rows, nofoot: true }) }); };
function cancelLookup(q) { const v = findVisits(q)[0]; if (!v) return toast(t('visitNotFound'), 'error'); modal({ title: `${t('cancelServices')} · ${v.acc}`, size: 'lg', body: `<div class="warn-strip">${t('cancelWarn')}</div><table class="g compact"><thead><tr><th></th><th>${t('service')}</th><th>${t('status')}</th><th>${t('testStatus')}</th><th class="right">${t('patientShare')}</th><th class="right">${t('payerShare')}</th></tr></thead><tbody>${v.lines.map(l => { const rs = DB.results.filter(r => r.visit === v.id && (r.service === l.service || svcById(l.service).type === 'Package')); const verified = rs.some(r => stIdx(r.status) >= 3); return `<tr><td><input type="checkbox" class="cl" value="${l.id}" ${l.status === 'Cancelled' || verified ? 'disabled' : ''}></td><td>${esc(L(svcById(l.service)))}</td><td>${sb(l.status)}</td><td>${rs.length ? sb(SCREEN_ORDER[Math.min(...rs.map(r => stIdx(r.status)))]) : '—'}${verified ? ` <span class="small muted">${t('cannotCancelVerified')}</span>` : ''}</td><td class="right">${num(l.patient)}</td><td class="right">${num(l.payer)}</td></tr>`; }).join('')}</tbody></table><div class="field mt"><label>${t('cancellationReason')} <span class="req">*</span></label><select class="inp" id="cnReason"><option value="">${t('select')}</option>${reasonOpts('Cancellation').map(([v2, l]) => `<option value="${v2}">${esc(l())}</option>`).join('')}</select></div>`, foot: `<button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn danger" onclick="cancelApply(${v.id})">${ic('slash')} ${t('cancelSelected')}</button>` }); }
function cancelApply(id) { const v = byId(DB.visits, id); const ids = els('.cl:checked').map(i => Number(i.value)); const reason = el('#cnReason').value; if (!ids.length) return toast(t('selectServices'), 'error'); if (!reason) return toast(t('selectReason'), 'error'); ids.forEach(lid => { const l = v.lines.find(x => x.id === lid); l.status = 'Cancelled'; l.cancelReason = reason; l.cancelUser = userName(); l.cancelTime = nowISO(); const s = svcById(l.service); const svcIds = s.type === 'Package' ? s.members.map(m => m.service) : [s.id]; v.samples.forEach(smp => { smp.services = smp.services.filter(x => !svcIds.includes(x)); if (!smp.services.length && smp.status !== 'Rejected') { smp.status = 'Cancelled'; smp.events.push({ status: 'Cancelled', time: nowISO(), user: userName(), location: reason }); } }); DB.results = DB.results.filter(r => !(r.visit === v.id && svcIds.includes(r.service))); }); audit('Services cancelled', v.acc, `${ids.length} · ${reason}`); closeModal(); renderMain(); const rem = visitTotals(v).remaining; toast(t('cancelled'), 'warn', rem < 0 ? `${t('refundDue')} ${money(-rem)}` : ''); }

App.screens.batchPayment = p => { const no = p.batch || App.store.bpNo || ''; App.store.bpNo = no; const b = DB.batches.find(x => String(x.no) === String(no)); const vs = b ? b.visits.map(id => byId(DB.visits, id)).filter(Boolean) : []; const totalRem = vs.reduce((s, v) => s + Math.max(0, visitTotals(v).remaining), 0); return pageHead(t('batchPayment'), `${t('finance')} / ${t('batchPayment')}`) + card({ body: `<div class="scan"><input class="inp" id="bpq" value="${esc(no)}" placeholder="${t('batchNo')}" onkeydown="if(event.key==='Enter')navigate('batchPayment',{batch:this.value})"><button class="btn primary" onclick="navigate('batchPayment',{batch:el('#bpq').value})">${ic('search')} ${t('search')}</button></div><div class="row mt">${DB.batches.map(x => `<span class="chip" style="cursor:pointer" onclick="navigate('batchPayment',{batch:${x.no}})">${t('batchNo')} ${x.no} · ${x.type} · ${esc(x.company || byId(DB.sendingLabs, x.lab)?.name || '')}</span>`).join('')}</div>` }) + (b ? card({ title: `${t('batchNo')} ${b.no} · ${b.type} · ${esc(L(payerById(b.payer)))} / ${esc(L(tierOf(b.payer, b.tier)))}`, actions: totalRem > 0 ? `<button class="btn primary" onclick="batchPayAll(${b.no})">${ic('dollar', 14)} ${t('payAll')} ${money(totalRem)}</button>` : badge(t('settled'), 'ok'), flush: true, body: grid({ cols: [{ k: 'acc', l: 'accession', f: r => `<b>${r.acc}</b>` }, { k: 'patient', l: 'patient', f: r => esc(L(patientOf(r))) }, { k: 'pt', l: 'patientShare', f: r => money(visitTotals(r).patientShare) }, { k: 'py', l: 'payerShare', f: r => money(visitTotals(r).payerShare) }, { k: 'paid', l: 'totalPaid', f: r => money(visitTotals(r).paid) }, { k: 'rem', l: 'remaining', f: r => money(visitTotals(r).remaining) }], rows: vs, nofoot: true, actions: r => visitTotals(r).remaining > 0 ? `<button class="btn sm" onclick="payModal(${r.id})">${t('pay')}</button>` : '' }) + (b.type === 'Lab-to-Lab' ? `<div class="info" style="margin:12px">${t('l2lBilledToLab')}</div>` : '') }) : (no ? `<div class="bad-strip">${t('batchNotFound')}</div>` : '')); };

function pcrKitEditor(r) { r = r || {}; const genes = r.genes && r.genes.length ? r.genes : [{ dye: 'FAM', gene: '', pos: 38, bl: 40 }]; return formGrid([{ k: 'name', l: 'kit', req: true }, { k: 'instrument', l: 'instrument', req: true }, { k: 'serialLock', l: 'serialLock', help: 'serialLockHelp' }, { k: 'valueCol', l: 'valueColumn', type: 'select', opts: ['Cq', 'CT'] }, { k: 'sheet', l: 'runFileLayout', span: 2 }, statusField], r) + `<div class="section-title">${t('geneThresholds')}</div><table class="g compact"><thead><tr><th>${t('dye')}</th><th>${t('gene')}</th><th>${t('positiveCt')}</th><th>${t('borderlineCt')}</th><th></th></tr></thead><tbody id="geneRows">${genes.map(geneRow).join('')}</tbody></table><button class="btn sm" onclick="el('#geneRows').insertAdjacentHTML('beforeend',geneRow({dye:'',gene:'',pos:38,bl:40}))">${ic('plus', 14)} ${t('addGene')}</button><div class="section-title">${t('verdictRules')}</div><textarea class="inp" id="verdictRows" rows="4">${esc((r.verdicts || [['≥ 2 target genes positive', 'DETECTED'], ['1 target gene positive, or any borderline', 'Presumptive positive'], ['No target positive, IC positive', 'NOT DETECTED'], ['All genes negative incl. IC', 'INVALID — repeat']]).map(v => v.join(' => ')).join('\n'))}</textarea><div class="help">${t('verdictHelp')}</div><div class="section-title">${t('folders')}</div>${formGrid([{ k: 'fResult', l: 'resultFolder', val: r.folders?.result || 'D:\\COMM\\Results\\' }, { k: 'fBackup', l: 'backupFolder', val: r.folders?.backup || 'D:\\COMM\\Results\\Backup\\' }, { k: 'fFailed', l: 'failedFolder', val: r.folders?.failed || 'D:\\COMM\\Fail\\' }], {}, 'three')}`; }

function readPcrKit(root) { const o = readForm(root); o.genes = els('#geneRows tr').map(tr => { const i = tr.querySelectorAll('input'); return { dye: i[0].value, gene: i[1].value, pos: Number(i[2].value), bl: i[3].value === '' ? null : Number(i[3].value) }; }).filter(g => g.gene); o.verdicts = (el('#verdictRows').value || '').split('\n').map(l => l.split('=>').map(s => s.trim())).filter(v => v.length === 2); if (!o.genes.length) { toast(t('kitNeedsGene'), 'error'); return false; } o.folders = { result: o.fResult, backup: o.fBackup, failed: o.fFailed }; delete o.fResult; delete o.fBackup; delete o.fFailed; return o; }

function pcrSimulate(id) { const k = byId(DB.pcrKits, id); const wells = [['A02', 'QDOC0001671', [0, 0, 0, 34.47]], ['B02', 'QDOC0001549', [0, 26.65, 0, 31.06]], ['B03', 'QHC0003074', [35.17, 34.63, 33.33, 30.44]], ['C01', 'QHC0003090', [0, 0, 0, 0]]]; const judge = (g, ct) => (!ct || ct > (g.bl || g.pos)) ? '−' : ct <= g.pos ? '+' : 'BL'; const rows = wells.map(([w, sid, cts]) => { const marks = k.genes.map((g, i) => judge(g, cts[i])); const targets = marks.slice(0, k.genes.length - 1); const ic2 = marks[k.genes.length - 1]; const pos = targets.filter(m => m === '+').length, bl = targets.filter(m => m === 'BL').length; const verdict = pos === 0 && bl === 0 && ic2 === '−' ? 'INVALID' : pos >= 2 ? 'DETECTED' : pos === 1 || bl ? 'Presumptive positive' : 'NOT DETECTED'; return { w, sid, cts, marks, verdict }; }); modal({ title: `${t('simulateRun')} · ${k.name}`, size: 'lg', body: `<div class="help mb">${t('simulateHelp')}</div><table class="g compact"><thead><tr><th>${t('well')}</th><th>${t('sampleId')}</th>${k.genes.map(g => `<th>${esc(g.gene)}</th>`).join('')}<th>${t('verdict')}</th><th>Flag</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.w}</td><td class="mono">${r.sid}</td>${r.cts.map((c, i) => `<td>${c || '0.00'} <span class="tag">${r.marks[i]}</span></td>`).join('')}<td>${badge(r.verdict, r.verdict === 'DETECTED' ? 'bad' : r.verdict === 'NOT DETECTED' ? 'ok' : r.verdict === 'INVALID' ? 'muted' : 'warn')}</td><td class="mono small">${r.cts.map((c, i) => `${r.w}-${k.genes[i].gene}-${c}`).join('\\\\')}</td></tr>`).join('')}</tbody></table>`, foot: `<button class="btn" onclick="closeModal()">${t('close')}</button>` }); }
