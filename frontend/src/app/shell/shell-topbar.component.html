<header class="topbar">
  <!-- collapses / expands the sidebar; under 960px opens it as a drawer -->
  <button type="button" class="icon-btn menu-btn" (click)="menuToggled.emit()" aria-controls="app-sidebar" [attr.aria-expanded]="menuExpanded()" [attr.aria-label]="menuLabel()" [title]="menuLabel()"><app-icon name="menu" /></button>
  <!-- the client laboratory (name + logo / initials); the Sky LIS logo is at the top of the sidebar -->
  <app-shell-lab-brand />

  <app-search-box class="global-search" [fallback]="true" [debounce]="120" [placeholder]="i18n.t('shell.searchPlaceholder')" [label]="i18n.t('shell.searchLabel')" [(value)]="navSearch" (keydown.enter)="searchSubmitted.emit()" />

  <div class="grow"></div>

  @if (branchLabel(); as branch) {
    <span class="pill branch-pill" [title]="i18n.t('shell.currentBranch')">{{ branch }}</span>
  }
  <span class="pill">{{ portalLabel() }}</span>

  <button type="button" class="lang-btn" (click)="onLanguage()" [attr.aria-label]="i18n.t('shell.switchLanguage')">
    <app-icon name="globe" [size]="15" />
    <span>{{ otherLanguageLabel() }}</span>
  </button>

  <div class="profile-wrap">
    <button type="button" class="profile" (click)="toggleUserMenu()" aria-haspopup="menu" aria-controls="app-user-menu" [attr.aria-expanded]="menuOpen()">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="who">
        <b>{{ displayName() }}</b>
        <span>{{ roleName() ?? portalLabel() }}</span>
      </span>
      <app-icon name="chevron-down" [size]="14" />
    </button>
    @if (menuOpen()) {
      <div class="menu-pop" role="menu" id="app-user-menu" [attr.aria-label]="i18n.t('shell.userMenu')">
        <div class="menu-head">
          <b>{{ displayName() }}</b>
          <span>{{ roleName() ?? portalLabel() }}</span>
          @if (branchLabel(); as branch) {
            <span class="menu-branch">{{ branch }}</span>
          }
        </div>
        @if (sessionBranches.canChange()) {
          <button type="button" class="mi change-branch" role="menuitem" (click)="onChangeBranch()"><app-icon name="building" [size]="16" />{{ i18n.t('shell.changeBranch') }}</button>
        }
        <button type="button" class="mi" role="menuitem" (click)="onLanguage()"><app-icon name="globe" [size]="16" />{{ otherLanguageLabel() }}</button>
        <button type="button" class="mi danger" role="menuitem" (click)="onSignOut()"><app-icon name="log-out" [size]="16" />{{ i18n.t('shell.signOut') }}</button>
      </div>
    }
  </div>
</header>
