<section class="card">
  <h1>{{ i18n.t('home.title') }}</h1>
  @if (auth.currentUser(); as user) {
    <p>{{ i18n.t('home.welcome') }} <strong>{{ user.displayName }}</strong></p>
  }
  <p class="muted">{{ i18n.t('home.noPages') }}</p>
  <a class="btn" [routerLink]="profilePath">{{ i18n.t('home.openProfile') }}</a>
</section>
