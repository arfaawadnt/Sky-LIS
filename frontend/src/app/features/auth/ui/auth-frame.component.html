<div class="page">
  <header class="head">
    <a class="brand" routerLink="/welcome">
      <img src="/brand/sky-lis-logo.png" alt="Sky LIS" width="231" height="112" />
      <span class="visually-hidden">{{ i18n.t('auth.publicSite') }}</span>
    </a>
    <button type="button" class="lang-btn" (click)="toggleLanguage()" [attr.aria-label]="i18n.t('auth.switchLanguage')">
      <app-icon name="globe" [size]="16" />
      <span>{{ otherLanguage() }}</span>
    </button>
  </header>

  <main class="main">
    <div class="hero">
      <p class="eyebrow">{{ eyebrow() }}</p>
      <h1>{{ heroTitle() }}</h1>
      <p class="lead">{{ lead() }}</p>
    </div>

    <section class="card" [attr.aria-labelledby]="labelledBy()">
      <ng-content />
    </section>
  </main>

  <footer class="foot">
    <span>{{ i18n.t('auth.copyright') }}</span>
    <nav [attr.aria-label]="i18n.t('auth.otherLinks')">
      <a routerLink="/welcome">{{ i18n.t('auth.publicSite') }}</a>
      @if (showSubscribe()) {
        <span>{{ i18n.t('auth.newLaboratory') }} <a class="strong" routerLink="/welcome/subscribe">{{ i18n.t('auth.subscribe') }}</a></span>
      }
    </nav>
  </footer>
</div>
