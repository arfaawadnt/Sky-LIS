<app-page-header [title]="i18n.t('catalogue-a.compatible.title')" [subtitle]="i18n.t('catalogue-a.compatible.subtitle')">
  <app-catalogue-export-button pageActions ngProjectAs="[pageActions]" *appCan="permissions.export" [exporter]="exportCsv" />
</app-page-header>

<app-section-card [padded]="false">
  <app-toolbar>
    <app-search-box toolbarFilters [placeholder]="i18n.t('catalogue-a.compatible.searchPlaceholder')" (searchChange)="facade.setSearch($event)" />
    <button toolbarActions type="button" class="btn ghost" (click)="facade.list.reload()"><app-icon name="refresh" [size]="15" />{{ i18n.t('catalogue-a.refresh') }}</button>
  </app-toolbar>

  @if (facade.list.error()) {
    <p class="problem list-problem" role="alert">{{ i18n.t('catalogue-a.loadError') }}</p>
  }
  <p class="muted small list-problem">{{ i18n.t('catalogue-a.compatible.hint') }}</p>

  <app-data-table [columns]="columns" [rows]="facade.rows()" [loading]="facade.list.isLoading()" [caption]="i18n.t('catalogue-a.compatible.title')" [emptyTitle]="i18n.t('catalogue-a.compatible.empty')" (rowActivate)="open($event)">
    <ng-template appCell="mergesInto" [appCellOf]="facade.rows()" let-row>
      @if (row.targetCode === null) {
        <span class="muted">{{ mergesIntoText(row) }}</span>
      } @else {
        <app-badge tone="info">{{ mergesIntoText(row) }}</app-badge>
      }
    </ng-template>
    <ng-template appRowActions [appRowActionsOf]="facade.rows()" let-row>
      <app-badge [status]="rowStatus(row)" />
      @if (canEditRow(row)) {
        <button type="button" class="row-btn" *appCan="permissions.edit" (click)="open(row)" [attr.aria-label]="i18n.tf('catalogue-a.compatible.edit', { code: row.typeCode })" [title]="i18n.tf('catalogue-a.compatible.edit', { code: row.typeCode })"><app-icon name="edit" [size]="15" /></button>
      }
    </ng-template>
  </app-data-table>
</app-section-card>

<app-compatible-conditions-drawer [(open)]="drawerOpen" [sampleType]="editing()" [saving]="facade.save.pending()" [problem]="facade.save.problem()" (save)="save($event)" (closed)="onClosed()" />
